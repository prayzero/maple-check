  const m = {};

  const introducedAt = PRICE_HISTORY.findIndex(period =>

/* 저장된 보스 데이터를 현재 기본 목록과 동기화
 * - 기본 목록에서 빠진 보스(일간 전환된 힐라/시그너스/핑크빈 등)는 자동 제거
 * - 새로 추가된 기본 보스는 합류
 * - 기존 보스의 사용자 가격/인원 수정값은 그대로 유지 */
const isPlainObject = (value) => !!value && typeof value === 'object' && !Array.isArray(value);
const cloneJson = (value) => JSON.parse(JSON.stringify(value));
const safeNonNegativeInt = (value, fallback = 0) =>
  Number.isFinite(Number(value)) && Number(value) >= 0 ? Math.floor(Number(value)) : fallback;

// 정식 서버 반영 전 저장된 기본값만 새 공식값으로 교체한다.
// 사용자가 직접 입력한 다른 가격은 그대로 보존한다.
const BOSS_DEFAULT_PRICE_MIGRATIONS = Object.fromEntries(Object.entries(REWORK_PRICE_MAP).map(([id, diffs]) =>
  [id, Object.fromEntries(Object.entries(diffs).map(([diff, to]) => [diff, {
    from: [PRE_REWORK_PRICE_MAP[id][diff],
      ...(id === 'bellona' && diff === 'Normal' ? [850000000] : []),
      ...(id === 'will' && diff === 'Easy' ? [32300000] : [])], to,
  }]))],
));

const migrateSavedBossPrice = (bossId, difficulty, savedPrice, defaultPrice) => {
  const migration = BOSS_DEFAULT_PRICE_MIGRATIONS[bossId]?.[difficulty];
  if (!migration || defaultPrice !== migration.to) return savedPrice;
  return migration.from.includes(savedPrice) ? migration.to : savedPrice;
};

const reconcileBossData = (saved) => {
  if (!Array.isArray(saved)) return cloneJson(DEFAULT_BOSSES);
  const savedMap = new Map(
    saved.filter(b => isPlainObject(b) && typeof b.id === 'string').map(b => [b.id, b])
  );
  return DEFAULT_BOSSES.map(def => {
    const old = savedMap.get(def.id);
    const difficulties = {};
    for (const [diff, defaultValue] of Object.entries(def.difficulties)) {
      const base = typeof defaultValue === 'number'
        ? { price: defaultValue, max: 6 }
        : { price: defaultValue.price || 0, max: defaultValue.max || 6 };
      const raw = old?.difficulties?.[diff];
      const value = typeof raw === 'number' ? { price: raw, max: base.max } : raw;
      const savedPrice = safeNonNegativeInt(value?.price, base.price);
      difficulties[diff] = {
        price: migrateSavedBossPrice(def.id, diff, savedPrice, base.price),
        max: Math.min(6, Math.max(1, safeNonNegativeInt(value?.max, base.max))),
      };
    }
    return { ...cloneJson(def), difficulties };
  });
};

const fmtMeso = (n) => {
  if (!n || n === 0) return '0 메소';
  const jo = Math.floor(n / 1000000000000);
  const eok = Math.floor((n % 1000000000000) / 100000000);
  const man = Math.floor((n % 100000000) / 10000);
  const won = n % 10000;
  const parts = [];
  if (jo) parts.push(`${jo.toLocaleString()}조`);
  if (eok) parts.push(`${eok.toLocaleString()}억`);
  if (man) parts.push(`${man.toLocaleString()}만`);
  if (!jo && !eok && !man && won) parts.push(won.toLocaleString());
  return (parts.join(' ') || '0') + ' 메소';
};

// 분 → "X시간 Y분" / "Y분"
const fmtMinutes = (m) => {
  m = Math.max(0, Math.round(m || 0));
  if (m === 0) return '0분';
  const h = Math.floor(m / 60), mm = m % 60;
  return (h ? `${h}시간 ` : '') + (mm || !h ? `${mm}분` : '').trim();
};

const todayStr = () => {
  const d = new Date();
  const yyyy = d.getFullYear();
  const mm = String(d.getMonth() + 1).padStart(2, '0');
  const dd = String(d.getDate()).padStart(2, '0');
  return `${yyyy}-${mm}-${dd}`;
};

const daysUntil = (dateStr) => {
  if (!dateStr) return null;
  const t = new Date(dateStr + 'T00:00:00');
  const today = new Date();
  today.setHours(0,0,0,0);
  return Math.ceil((t - today) / (1000 * 60 * 60 * 24));
};

  const d = boss?.difficulties?.[diff];
  if (!d) return { price: 0, max: 6 };
  // 구버전 호환 (숫자 → 객체)
  if (typeof d === 'number') return { price: d, max: 6 };
  return { price: d.price || 0, max: d.max || 6 };
};

const clampPartyMembers = (value, max = 6) =>
  Math.min(Math.max(1, parseInt(value, 10) || 1), Math.min(6, Math.max(1, parseInt(max, 10) || 1)));

const getBossRevenue = (boss, row) => {
  const { price, max } = getDifficultyEntry(boss, row?.difficulty);
  const members = clampPartyMembers(row?.partyMembers, max);
  return { price, max, members, revenue: Math.floor(price / members) };
};

  for (let n = lo; n < hi; n++) sum += kind === 'arcane' ? (n * n + 11) : (9 * n * n + 20 * n);

  const hi = Math.max(0, Math.min(arr.length - 1, parseNum(tgt)));
  if (hi <= lo) return 0;
  return (arr[hi] || 0) - (arr[lo] || 0);
};

const sfExpect = (o) => {

    const H = round100(1000 + Math.pow(lvl, 3) * Math.pow(n + 1, n <= 9 ? 1 : 2.7) / denom);
    const I = round100(H * (n < 17 ? 1 - o.mvp - (o.pcRoom ? 0.05 : 0) : 1) * (o.disc30 ? 0.7 : 1));

    const traceClimbP = n > 22 ? cum22P : 0;
    const traceClimbR = n > 22 ? cum22R : 0;
    const traceClimbS = n > 22 ? cum22S : 0;
    const traceClimbT = n > 22 ? cum22T : 0;
    const traceClimbU = n > 22 ? cum22U : 0;
    const M = n < 15 ? I / succ : (I + boom * (o.spare + cumP)) / succ;
    const N = (n < 15 || !hasRestore) ? Infinity : (I + boom * (L + K * o.spare + traceClimbP)) / succ;
    // 성공률 100% 이벤트 중에는 파괴 확률이 없으므로 파괴방지 비용을 더하지 않는다.
    const O = (n >= 15 && n <= 17 && boom > 0) ? J / succ : Infinity;
    const noGuard = n < 15 ? M : recover === 'spare12' ? M : recover === 'restore' ? N : Math.min(M, N);
    let P;
    if (n < 15) P = M;
    else if (o.guard === 'all1517' && Number.isFinite(O)) P = O;
    else if (o.guard === 'none') P = noGuard;
    else P = Math.min(noGuard, O);
    const Q = n < 15 ? '일반' : P === O ? '파괴방지' : P === N ? '흔적 복구' : '12성 복구';
    const R = n < 15 ? I / succ : Q === '파괴방지' ? J / succ : Q === '흔적 복구' ? (I + boom * (L + traceClimbR)) / succ : (I + boom * cumR) / succ;
    const S = n < 15 ? 0 : Q === '파괴방지' ? 0 : Q === '흔적 복구' ? boom * (K + traceClimbS) / succ : boom * (1 + cumS) / succ;
    const T = n < 15 ? 1 / succ : Q === '파괴방지' ? 1 / succ : Q === '흔적 복구' ? (1 + boom * traceClimbT) / succ : (1 + boom * cumT) / succ;
    const U = (n < 15 || Q === '파괴방지') ? 0 : Q === '흔적 복구' ? boom * (1 + traceClimbU) / succ : boom * (1 + cumU) / succ;
    if (n >= 12) { cumP += P; cumR += R; cumS += S; cumT += T; cumU += U; }
    if (n >= 22) { cum22P += P; cum22R += R; cum22S += S; cum22T += T; cum22U += U; }
    rows.push({ star: n, strategy: Q, P, R, S, T, U, success: succ, boomChance: boom, noGuardCost: noGuard, guardCost: O });
  }
  const res = { total: 0, meso: 0, equips: 0, tries: 0, booms: 0, rows: [] };
  for (let n = o.from; n < o.to; n++) {
    const r = rows[n];
    res.total += r.P; res.meso += r.R; res.equips += r.S; res.tries += r.T; res.booms += r.U;
    res.rows.push({
      star: n,
      strategy: r.strategy,
      cost: r.P,
      noGuardCost: r.noGuardCost,
      guardCost: r.guardCost,
      boomChance: r.boomChance,
    });
  }
  return res;
};

// 현재 장비·할인·이벤트 조건에서 복구 방식별 전체 기대비용을 비교한다.
const sfRecoveryComparison = (o) => {
  const modes = [
    { id: 'spare12', label: '12성 복구' },
    ...(SF_RESTORE[o.level] ? [{ id: 'restore', label: '흔적 복구' }] : []),
    { id: 'auto', label: SF_RESTORE[o.level] ? '성급별 자동 최저' : '자동 (12성 복구 기준)' },
  ];
  const rows = modes.map(mode => ({ ...mode, result: sfExpect({ ...o, recover: mode.id }) }));
  const best = Math.min(...rows.map(row => row.result.total));
  return rows.map(row => ({ ...row, difference: row.result.total - best, best: Math.abs(row.result.total - best) < 0.5 }));
};

// 15→16, 16→17, 17→18성 각각의 파괴방지 비용과 스페어 손익분기 가격을 계산한다.
// 앞선 성급은 자동 최저 전략으로 계산하므로 재등반 비용 변화도 손익분기에 포함된다.
const sfSafeguardComparison = (o) => {
  const maxStar = sfMaxStar(o.level);
  return [15, 16, 17].filter(star => star < maxStar).map(star => {
    const rowAt = (spare) => sfExpect({ ...o, recover: 'auto', spare, from: star, to: star + 1, guard: 'auto' }).rows[0];
    const current = rowAt(o.spare);
    if (!Number.isFinite(current.guardCost)) {
      return { star, eventSafe: true, noGuardCost: current.noGuardCost, guardCost: null, difference: 0, threshold: null, recommendGuard: false };
    }

    const deltaAt = (spare) => {
      const row = rowAt(spare);
      return row.noGuardCost - row.guardCost;
    };
    let threshold = 0;
    if (deltaAt(0) < 0) {
      let low = 0;
      let high = 100000000;
      while (high < 1000000000000000000 && deltaAt(high) < 0) high *= 2;
      if (deltaAt(high) < 0) threshold = Infinity;
      else {
        for (let i = 0; i < 60; i++) {
          const mid = (low + high) / 2;
          if (deltaAt(mid) >= 0) high = mid;
          else low = mid;
        }
        threshold = high;
      }
    }
    const signedDifference = current.noGuardCost - current.guardCost;
    return {
      star,
      eventSafe: false,
      noGuardCost: current.noGuardCost,
      guardCost: current.guardCost,
      difference: Math.abs(signedDifference),
      threshold,
      recommendGuard: signedDifference >= 0,
    };
  });
};

/* =========================================================
 * 잠재(큐브) 데이터 — 등급업 확률·천장, 동일등급 줄 확률, 메소 재설정 비용
 * ========================================================= */
const GRADES = ['레어', '에픽', '유니크', '레전드리'];
const CUBE_TIERUP = {
  '메소 일반/블랙': { r2e: [0.150000001275, 10], e2u: [0.035, 42], u2l: [0.014, 107] },
  '메소 에디':      { r2e: [0.02381, 62], e2u: [0.009804, 152], u2l: [0.007, 214] },
};
const CUBE_MESO_COST = {
  normal: [ // 일반 잠재(메소)
    { lo: 1, hi: 159, c: { '레어': 4000000, '에픽': 16000000, '유니크': 34000000, '레전드리': 40000000 } },
    { lo: 160, hi: 199, c: { '레어': 4250000, '에픽': 17000000, '유니크': 36125000, '레전드리': 42500000 } },
    { lo: 200, hi: 249, c: { '레어': 4500000, '에픽': 18000000, '유니크': 38250000, '레전드리': 45000000 } },
    { lo: 250, hi: 300, c: { '레어': 5000000, '에픽': 20000000, '유니크': 42500000, '레전드리': 50000000 } },
  ],

    { lo: 1, hi: 159, c: { '레어': 9750000, '에픽': 27300000, '유니크': 66300000, '레전드리': 78000000 } },
    { lo: 160, hi: 199, c: { '레어': 10375000, '에픽': 29050000, '유니크': 70550000, '레전드리': 83000000 } },
    { lo: 200, hi: 249, c: { '레어': 11000000, '에픽': 30800000, '유니크': 74800000, '레전드리': 88000000 } },
    { lo: 250, hi: 300, c: { '레어': 12250000, '에픽': 34300000, '유니크': 83300000, '레전드리': 98000000 } },
  ],
};
const cubeMesoCost = (kind, lvl, grade) => {
  const row = (CUBE_MESO_COST[kind] || []).find(r => lvl >= r.lo && lvl <= r.hi);
  return row ? row.c[grade] || 0 : 0;

/* =========================================================
 * 정밀 큐브 목표옵션 (KMS 공식 API 확률, 2026-07-15) — cube-options-v2.json 지연 로드
 * data = { parts:[[name,id]], options:[[text,rg,maxlines]], dists:[[[optIdx,prob]]], ctx:{numkey:[d1,d2,d3]} }
 * numeric_lookup_key = method(0/1e7) + 레전드리(4e6) + part×1e4 + 대표레벨
 * ========================================================= */
const CUBE_REP_LEVEL = (L) => L <= 9 ? 0 : L <= 120 ? (L % 10 === 0 ? L : Math.floor(L / 10) * 10 + 1) : L <= 200 ? 120 : 201;
const CUBE_GRADE_OFFSET = { '레어': 1000000, '에픽': 2000000, '유니크': 3000000, '레전드리': 4000000 };
const cubeContextKey = (method, grade, partId, level) =>
  (method === 'black' ? 0 : 10000000) + (CUBE_GRADE_OFFSET[grade] || 0) + partId * 10000 + CUBE_REP_LEVEL(level);
const CUBE_RGROUPS = [['usable_skill', 1], ['after_hit_invincibility', 1], ['on_hit_damage_ignore', 2], ['on_hit_invincibility', 2]];
const CUBE_CRITICAL_DAMAGE_RE = /^크리티컬 데미지 \+\d+%$/;
const CUBE_COOLDOWN_RE = /^스킬 재사용 대기시간 -(\d+)초$/;
const CUBE_ITEM_DROP_RE = /^아이템 드롭률 \+\d+%$/;

const cubeContext = (data, method, grade, partId, level) => {
  const ctx = data?.ctx?.[String(cubeContextKey(method, grade, partId, level))];
  if (!ctx) return null;
  const dists = ctx.map(di => di >= 0 ? data.dists[di] : null);
  return dists.every(Boolean) ? dists : null;
};

const cubeConditionalDist = (data, dist, priorGroups, lineIndex, primeOptions) => {
  let excludedMass = 0;
  const blocked = new Set();
  for (const [group, maximum] of CUBE_RGROUPS) {
    if ((priorGroups[group] || 0) >= maximum) blocked.add(group);
  }
  for (const entry of dist || []) {
    const group = data.options[entry[0]]?.[1] || '';
    if (blocked.has(group)) excludedMass += entry[1];
  }
  const denominator = 1 - excludedMass;
  if (denominator <= 0) return { rows: [], excludedMass };
  const rows = [];
  for (const entry of dist || []) {
    const [idx, raw, explicitPrime] = entry;
    const option = data.options[idx] || ['', '', 0];
    const group = option[1] || '';
    if (blocked.has(group)) continue;
    const text = option[0];
    const cooldownMatch = text.match(CUBE_COOLDOWN_RE);
    rows.push({
      idx,
      text,
      raw,
      p: raw / denominator,
      group,
      isPrime: explicitPrime == null ? (lineIndex === 0 || primeOptions.has(idx)) : !!explicitPrime,
      isCriticalDamage: CUBE_CRITICAL_DAMAGE_RE.test(text),
      cooldownSeconds: cooldownMatch ? Number(cooldownMatch[1]) : 0,
    });
  }
  return { rows, excludedMass };
};

function cubeGoalProbability(data, method, grade, partId, level, predicate) {
  const dists = cubeContext(data, method, grade, partId, level);
  if (!dists) return { ok: false, reason: 'no-context', perRoll: 0 };
  const primeOptions = new Set(dists[0].map(entry => entry[0]));
  let success = 0;
  const visit = (lineIndex, probability, priorGroups, lines) => {
    if (lineIndex === 3) {
      if (predicate(lines)) success += probability;
      return;
    }
    const { rows } = cubeConditionalDist(data, dists[lineIndex], priorGroups, lineIndex, primeOptions);
    for (const row of rows) {
      const nextGroups = row.group
        ? { ...priorGroups, [row.group]: (priorGroups[row.group] || 0) + 1 }
        : priorGroups;
      visit(lineIndex + 1, probability * row.p, nextGroups, [...lines, row]);
    }
  };
  visit(0, 1, {}, []);
  return { ok: true, perRoll: success };
}

// picks = [pick1,pick2,pick3]; 각 pick = 옵션 전역 인덱스(number) | 'any'(무시) | null(미선택)
function cubeExactRoll(data, method, grade, partId, level, picks) {
  const dists = cubeContext(data, method, grade, partId, level);
  if (!dists) return { ok: false, reason: 'no-context', lines: [], perRoll: 0 };
  const primeOptions = new Set(dists[0].map(entry => entry[0]));
  const priorGroups = {}; const lines = []; let complete = true; let deterministicPrefix = true;
  for (let li = 0; li < 3; li++) {
    const wanted = picks[li];
    if (wanted === 'any') {
      lines.push({ any: true, p: 1, present: true, excl: 0 });
      deterministicPrefix = false;
      continue;
    }
    if (wanted == null) {
      complete = false;
      lines.push({ p: 0, present: false, excl: 0 });
      deterministicPrefix = false;
      continue;
    }
    if (!deterministicPrefix) {
      lines.push({ p: null, present: true, excl: 0 });
      continue;
    }
    const conditional = cubeConditionalDist(data, dists[li], priorGroups, li, primeOptions);
    const row = conditional.rows.find(candidate => candidate.idx === wanted);
    lines.push({ raw: row?.raw || 0, excl: conditional.excludedMass, p: row?.p || 0, present: !!row, rg: row?.group || '' });
    if (row?.group) priorGroups[row.group] = (priorGroups[row.group] || 0) + 1;
  }
  if (!complete) return { ok: true, lines, perRoll: 0, complete };
  const goal = cubeGoalProbability(data, method, grade, partId, level,
    rolled => rolled.every((row, index) => picks[index] === 'any' || row.idx === picks[index]));
  return { ok: true, lines, perRoll: goal.perRoll, complete };
}

// 선택한 목표마다 서로 다른 한 줄을 사용한다. 같은 목표가 두 번이면 실제 두 줄이 필요하다.
const cubeUnorderedMatch = (lines, targets, matcher) => {
  const wanted = targets.filter(target => target !== 'any' && target != null);
  const used = Array(lines.length).fill(false);
  const visit = (targetIndex) => {
    if (targetIndex >= wanted.length) return true;
    for (let lineIndex = 0; lineIndex < lines.length; lineIndex++) {
      if (used[lineIndex] || !matcher(wanted[targetIndex], lines[lineIndex])) continue;
      used[lineIndex] = true;
      if (visit(targetIndex + 1)) return true;
      used[lineIndex] = false;
    }
    return false;
  };
  return visit(0);
};

const cubeUnorderedProbability = (data, method, grade, partId, level, targets, matcher) =>
  cubeGoalProbability(
    data,
    method,
    grade,
    partId,
    level,
    lines => cubeUnorderedMatch(lines, targets, matcher),
  );

// 등급업 단계 (천장·연속실패 반영, 유니크→레전드리는 0회 누적 기준) — targetGrade에서 멈춤
function cubeGradeUp({ method, level, curGrade, targetGrade = '레전드리', fails = {} }) {
  const gi = g => GRADES.indexOf(g);
  const way = method === 'black' ? 'normal' : 'addi';
  const tierKey = method === 'black' ? '메소 일반/블랙' : '메소 에디';
  const stepsDef = [['레어', '에픽', 'r2e'], ['에픽', '유니크', 'e2u'], ['유니크', '레전드리', 'u2l']];
  // 유니크→레전드리는 수동 실패 횟수를 받지 않고 0회 누적 기준으로 계산한다.
  const failArr = [fails.r2e || 0, fails.e2u || 0, 0];
  let tries = 0, meso = 0; const rows = [];
  stepsDef.forEach(([a, b, k], idx) => {
    if (gi(curGrade) <= gi(a) && gi(a) < gi(targetGrade)) {
      const [p, pity] = CUBE_TIERUP[tierKey][k];
      const f = gi(curGrade) === gi(a) ? failArr[idx] : 0;
      const remain = pity - f;
      const t = remain > 0 ? (1 - Math.pow(1 - p, remain)) / p : 0;
      const cost1 = cubeMesoCost(way, level, a);
      tries += t; meso += t * cost1;
      rows.push({ from: a, to: b, tries: t, meso: t * cost1, pity, ceilingMeso: pity * cost1 });
    }
  });
  return { tries, meso, rows, way };
}

function useCubeData() {

}

// 현재 문맥의 줄별 옵션 목록 (확률 내림차순). 없으면 null
const cubeLineRows = (cube, method, grade, partId, level) => {
  if (!cube) return null;
  const ctx = cube.ctx[String(cubeContextKey(method, grade, partId, level))];
  if (!ctx) return null;
  const primeOptions = new Set((ctx[0] >= 0 ? cube.dists[ctx[0]] : []).map(entry => entry[0]));
  return ctx.map((di, lineIndex) => di < 0 ? [] : cube.dists[di]
    .map(([oi, p, explicitPrime]) => ({
      idx: oi,
      text: cube.options[oi][0],
      prob: p,
      isPrime: explicitPrime == null ? lineIndex === 0 || primeOptions.has(oi) : !!explicitPrime,
    }))
    .sort((a, b) => b.prob - a.prob));

const cubeMergedChoiceRows = (lineRows) => {
  const byText = new Map();
  for (const rows of lineRows || []) {
    for (const row of rows || []) {
      const current = byText.get(row.text);
      if (!current ||
          (row.isPrime && !current.isPrime) ||
          (row.isPrime === current.isPrime && row.prob > current.prob)) {
        byText.set(row.text, row);
      }
    }
  }
  return [...byText.values()].sort((a, b) =>
    Number(b.isPrime) - Number(a.isPrime) || b.prob - a.prob || a.text.localeCompare(b.text)
  );
};
const cubePickStrong = (rows, li) => {
  for (const key of CUBE_PREF_BY_LINE[li]) { const m = rows.find(r => r.text.includes(key)); if (m) return m.idx; }
  return rows.length ? rows[0].idx : 'any';
};

const cubeGoalNeedsFocus = (target) => !!target && (

);
const createCubeFocusMatcher = (focus, method) => {
  const escaped = focus.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  const percent = new RegExp(`^${escaped} \\+\\d+%$`);
  if (method !== 'addi') return (text) => percent.test(text);
  // 에디셔널의 고정 수치와 '캐릭터 기준 N레벨 당' 옵션도 실제 유효 줄로 합산한다.
  const flat = new RegExp(`^${escaped} \\+\\d+$`);
  const perLevel = new RegExp(`^캐릭터 기준 \\d+레벨 당 ${escaped} \\+\\d+$`);
  return (text) => percent.test(text) || flat.test(text) || perLevel.test(text);
};
const cubeGoalPredicate = (target, focus, method) => {
  if (!target) return null;
  const matchesFocus = createCubeFocusMatcher(focus, method);
  const seconds = target.match(/^(\d+)초/);
  const cooldownGoal = seconds ? Number(seconds[1]) : 0;
  const focusNeed = target.endsWith('주주') ? 2 : target.endsWith('주') ? 1 : 0;
  return (lines) => {
    const focused = lines.filter(line => matchesFocus(line.text));
    const primeFocused = focused.filter(line => line.isPrime);
    const criticalDamage = lines.filter(line => line.isCriticalDamage ?? CUBE_CRITICAL_DAMAGE_RE.test(line.text)).length;
    const cooldown = lines.reduce((sum, line) => {
      if (line.cooldownSeconds != null) return sum + line.cooldownSeconds;
      const match = line.text.match(CUBE_COOLDOWN_RE);
      return sum + (match ? Number(match[1]) : 0);
    }, 0);
    if (target === '2줄') return focused.length >= 2;
    if (target === '3줄') return focused.length >= 3;
    if (target === '3줄이탈') return focused.length >= 3 && primeFocused.length >= 2;
    if (target === '올이탈') return focused.length >= 3 && primeFocused.length >= 3;
    if (target === '아획' || target === '아확') return lines.some(line => CUBE_ITEM_DROP_RE.test(line.text));
    if (target === '크크') return criticalDamage >= 2;
    if (target === '크크주') return criticalDamage >= 2 && focused.length >= 1;
    if (seconds) return cooldown >= cooldownGoal && focused.length >= focusNeed;
    return false;
  };
};
const _cubeGoalCache = new Map();

// 슬롯 자동 잠재 비용: 등급업(cur→target) + 선택한 실제 옵션 목표의 통합 기대 메소
const cubeAutoPotentialCost = ({ cube, method, partId, level, curGrade, targetGrade, targetPreset, focus }) => {
  const gi = (g) => GRADES.indexOf(g);
  if (!Number.isFinite(Number(level)) || Number(level) < 1 || Number(level) > 300) return { ok: false, reason: 'level' };
  if (gi(targetGrade) < 0 || gi(curGrade) < 0) return { ok: false, reason: 'grade' };
  if (gi(curGrade) > gi(targetGrade)) return { ok: false, reason: 'downgrade' };
  const gup = cubeGradeUp({ method, level, curGrade, targetGrade, fails: {} });
  const way = method === 'black' ? 'normal' : 'addi';
  const costL = cubeMesoCost(way, level, targetGrade);
  if (!targetPreset) {
    return { ok: true, gradeOnly: true, gupMeso: gup.meso, targetMeso: 0, total: gup.meso, H: null, targetTries: 0 };
  }
  const predicate = cubeGoalPredicate(targetPreset, focus, method);
  if (!predicate) return { ok: false, reason: 'unsupported' };
  const cacheKey = [method, targetGrade, partId, CUBE_REP_LEVEL(level), targetPreset, focus].join('|');
  let goal = _cubeGoalCache.get(cacheKey);
  if (!goal) {
    goal = cubeGoalProbability(cube, method, targetGrade, partId, level, predicate);
    _cubeGoalCache.set(cacheKey, goal);
  }
  if (!goal.ok) return { ok: false, reason: goal.reason };
  const H = goal.perRoll;
  if (!(H > 0)) return { ok: false, reason: 'impossible', H: 0 };
  const upgrading = gi(curGrade) < gi(targetGrade);
  const targetTries = upgrading ? (1 - H) / H : 1 / H;
  const targetMeso = targetTries * costL;
  return { ok: true, gupMeso: gup.meso, targetMeso, total: gup.meso + targetMeso, H, targetTries };
};

const computeSetEffects = (equipment) => {
  const counts = {};
  for (const slot of EQUIP_SLOTS) {
    const it = equipment?.[slot.id]?.item;
    const sid = detectSetId(it);
    if (sid) counts[sid] = (counts[sid] || 0) + 1;
  }
  const sets = [];
  const total = {};
  for (const sid of Object.keys(counts)) {
    const def = SET_DATA[sid]; if (!def) continue;
    const cnt = counts[sid];
    const sum = {}; const activeTiers = [];
    for (const k of Object.keys(def.tiers)) {
      if (Number(k) <= cnt) {
        activeTiers.push(Number(k));
        for (const [stat, v] of Object.entries(def.tiers[k])) { sum[stat] = (sum[stat] || 0) + v; total[stat] = (total[stat] || 0) + v; }
      }
    }
    const maxTier = Math.max(0, ...Object.keys(def.tiers).map(Number));
    sets.push({ sid, name: def.name, count: cnt, maxTier, activeTier: Math.min(cnt, maxTier), sum });
  }
  sets.sort((a, b) => b.count - a.count);
  return { sets, total };
};

    .map(item => {
      let id = typeof item.id === 'string' ? item.id.trim().slice(0, 100) : '';
      if (!/^[A-Za-z0-9_-]+$/.test(id) || seenIds.has(id)) {
        do { id = budgetItemUid(); } while (seenIds.has(id));
      }
      seenIds.add(id);
      return {
        id,
        name: typeof item.name === 'string' ? item.name.slice(0, 100) : '',
        cost: safeBudgetMeso(item.cost, 0),
        saved: safeBudgetMeso(item.saved, 0),
        done: !!item.done,
        priority: Math.min(1000, safeNonNegativeInt(item.priority, 0)),
        memo: typeof item.memo === 'string' ? item.memo.slice(0, 500) : '',
      };
    });
  return {
    total: safeBudgetMeso(raw.total, 0),
    savedByItem,
    customItems,
  };
};

const normalizeChar = (c) => ({
  ...c,
  id: typeof c.id === 'string' && c.id ? c.id : uid(),
  name: typeof c.name === 'string' && c.name.trim() ? c.name : '이름 없는 캐릭터',
  durations: isPlainObject(c.durations) ? c.durations : {},
  bosses: Array.isArray(c.bosses) ? c.bosses : [],
  equipment: isPlainObject(c.equipment) ? c.equipment : {},
  goals: isPlainObject(c.goals) ? {
    level: { current: '', target: '', percent: '', ...(c.goals.level || {}) },
    symbols: {
      arcane: { ...emptyGoals().symbols.arcane, ...(c.goals.symbols?.arcane || {}) },
      authentic: { ...emptyGoals().symbols.authentic, ...(c.goals.symbols?.authentic || {}) },
      grand: { ...emptyGoals().symbols.grand, ...(c.goals.symbols?.grand || {}) },
      priority: c.goals.symbols?.priority || 0,
      done: !!c.goals.symbols?.done,
    },
    solErda: { ...emptyGoals().solErda, ...(c.goals.solErda || {}) },
    hexa: Array.isArray(c.goals.hexa) ? [0, 1, 2].map(i => !!c.goals.hexa[i]) : [false, false, false],
    setMemo: c.goals.setMemo || '',
  } : emptyGoals(),
  budget: normalizeBudget(c.budget),
  bossTimes: isPlainObject(c.bossTimes) ? c.bossTimes : {},
  hexaSkills: isPlainObject(c.hexaSkills) ? {
    slots: { ...emptyHexa().slots, ...(c.hexaSkills.slots || {}) },
    priority: c.hexaSkills.priority || 0,
    done: !!c.hexaSkills.done,
  } : emptyHexa(),
});

const validateBackupData = (value) => {
  const fail = (message) => { throw new Error(message); };
  if (!isPlainObject(value) || value.app !== 'maple-check' || value.version !== 1) {
    fail('메이플체크에서 내보낸 백업 파일이 아닙니다.');
  }
  if (!Array.isArray(value.characters) || !Array.isArray(value.bossData)) {
    fail('캐릭터 또는 보스 데이터 배열이 없습니다.');
  }
  if (value.characters.length > 200 || value.bossData.length > 100) fail('백업 데이터가 허용 범위를 초과했습니다.');

  const knownBossIds = new Set(DEFAULT_BOSSES.map(boss => boss.id));
  const seenBossIds = new Set();
  for (const boss of value.bossData) {
    if (!isPlainObject(boss) || typeof boss.id !== 'string' || !knownBossIds.has(boss.id) || seenBossIds.has(boss.id)) {
      fail('보스 데이터 구조가 올바르지 않습니다.');
    }
    seenBossIds.add(boss.id);
    if (!isPlainObject(boss.difficulties)) fail(`${boss.id} 난이도 데이터가 올바르지 않습니다.`);
    for (const entry of Object.values(boss.difficulties)) {
      const validNumber = typeof entry === 'number' && Number.isFinite(entry) && entry >= 0;
      const validObject = isPlainObject(entry)
        && Number.isFinite(Number(entry.price)) && Number(entry.price) >= 0
        && Number.isFinite(Number(entry.max)) && Number(entry.max) >= 1 && Number(entry.max) <= 6;
      if (!validNumber && !validObject) fail('결정석 가격 또는 최대 입장 인원이 올바르지 않습니다.');
    }
  }

  const nextBossData = reconcileBossData(value.bossData);
  const seenCharacterIds = new Set();
  const nextCharacters = value.characters.map((raw, index) => {
    if (!isPlainObject(raw) || typeof raw.id !== 'string' || !raw.id.trim() || seenCharacterIds.has(raw.id)) {
      fail(`${index + 1}번째 캐릭터 ID가 올바르지 않습니다.`);
    }
    if (typeof raw.name !== 'string' || !raw.name.trim()) fail(`${index + 1}번째 캐릭터 이름이 올바르지 않습니다.`);
    seenCharacterIds.add(raw.id);
    const objectFields = ['durations', 'equipment', 'goals', 'budget', 'bossTimes', 'hexaSkills'];
    for (const field of objectFields) {
      if (raw[field] != null && !isPlainObject(raw[field])) fail(`${raw.name}의 ${field} 구조가 올바르지 않습니다.`);
    }
    if (raw.goals?.level != null && !isPlainObject(raw.goals.level)) fail(`${raw.name}의 레벨 목표가 올바르지 않습니다.`);
    if (raw.goals?.symbols != null && !isPlainObject(raw.goals.symbols)) fail(`${raw.name}의 심볼 목표가 올바르지 않습니다.`);
    if (raw.goals?.solErda != null && !isPlainObject(raw.goals.solErda)) fail(`${raw.name}의 솔 에르다 목표가 올바르지 않습니다.`);
    if (raw.hexaSkills?.slots != null && !isPlainObject(raw.hexaSkills.slots)) fail(`${raw.name}의 HEXA 구조가 올바르지 않습니다.`);
    if (raw.budget) {
      if (raw.budget.total != null && (typeof raw.budget.total !== 'number' || !Number.isSafeInteger(raw.budget.total) || raw.budget.total < 0)) {
        fail(`${raw.name}의 예산 한도가 올바르지 않습니다.`);
      }
      if (raw.budget.savedByItem != null && !isPlainObject(raw.budget.savedByItem)) {
        fail(`${raw.name}의 목표별 모은 메소 구조가 올바르지 않습니다.`);
      }
      for (const [key, saved] of Object.entries(raw.budget.savedByItem || {})) {
        if (!/^[A-Za-z0-9_-]{1,100}$/.test(key) || typeof saved !== 'number' || !Number.isSafeInteger(saved) || saved < 0) {
          fail(`${raw.name}의 목표별 모은 메소 값이 올바르지 않습니다.`);
        }
      }
      if (raw.budget.customItems != null && !Array.isArray(raw.budget.customItems)) {
        fail(`${raw.name}의 직접 예산 목표가 올바르지 않습니다.`);
      }
      if ((raw.budget.customItems || []).length > 100) fail(`${raw.name}의 직접 예산 목표가 너무 많습니다.`);
      const seenBudgetItemIds = new Set();
      for (const item of raw.budget.customItems || []) {
        if (!isPlainObject(item) || typeof item.id !== 'string' || !/^[A-Za-z0-9_-]{1,100}$/.test(item.id) || seenBudgetItemIds.has(item.id)) {
          fail(`${raw.name}의 직접 예산 목표 ID가 올바르지 않습니다.`);
        }
        seenBudgetItemIds.add(item.id);
        if (item.name != null && typeof item.name !== 'string') fail(`${raw.name}의 직접 예산 목표 이름이 올바르지 않습니다.`);
        if (item.memo != null && typeof item.memo !== 'string') fail(`${raw.name}의 직접 예산 목표 메모가 올바르지 않습니다.`);
        if (item.done != null && typeof item.done !== 'boolean') fail(`${raw.name}의 직접 예산 목표 완료 값이 올바르지 않습니다.`);
        for (const field of ['cost', 'saved', 'priority']) {
          if (item[field] != null && (typeof item[field] !== 'number' || !Number.isSafeInteger(item[field]) || item[field] < 0)) {
            fail(`${raw.name}의 직접 예산 목표 ${field} 값이 올바르지 않습니다.`);
          }
        }
      }
    }
    if (!Array.isArray(raw.bosses)) fail(`${raw.name}의 보스 선택 목록이 올바르지 않습니다.`);
    if (raw.bosses.length > 100) fail(`${raw.name}의 보스 선택 목록이 너무 많습니다.`);
    for (const slot of Object.values(raw.equipment || {})) {
      if (!isPlainObject(slot)) fail(`${raw.name}의 장비 데이터가 올바르지 않습니다.`);
      for (const field of ['item', 'potTarget', 'potFocus', 'addPotTarget', 'addPotFocus', 'soul', 'memo']) {
        if (slot[field] != null && typeof slot[field] !== 'string') fail(`${raw.name}의 장비 ${field} 값이 올바르지 않습니다.`);
      }
      for (const field of ['flameDone', 'jakDone', 'done']) {
        if (slot[field] != null && typeof slot[field] !== 'boolean') fail(`${raw.name}의 장비 ${field} 값이 올바르지 않습니다.`);
      }
      for (const field of ['cost', 'priority']) {
        if (slot[field] != null && (typeof slot[field] !== 'number' || !Number.isFinite(slot[field]) || slot[field] < 0)) {
          fail(`${raw.name}의 장비 ${field} 값이 올바르지 않습니다.`);
        }
      }
      if (slot.star != null && slot.star !== '' && (typeof slot.star !== 'number' || !Number.isFinite(slot.star) || slot.star < 0 || slot.star > 30)) {
        fail(`${raw.name}의 장비 스타포스 값이 올바르지 않습니다.`);
      }
      for (const field of ['potential', 'addPotential']) {
        if (slot[field] != null && !POTENTIAL_GRADES.includes(slot[field])) fail(`${raw.name}의 장비 잠재등급이 올바르지 않습니다.`);
      }
      for (const field of ['potFocus', 'addPotFocus']) {
        if (slot[field] != null && !CUBE_FOCUS_OPTIONS.includes(slot[field])) fail(`${raw.name}의 장비 유효옵션 기준이 올바르지 않습니다.`);
      }
    }
    const durations = {};
    for (const [key, date] of Object.entries(raw.durations || {})) {
      if (typeof date !== 'string' || (date && !/^\d{4}-\d{2}-\d{2}$/.test(date))) fail(`${raw.name}의 만료일이 올바르지 않습니다.`);
      durations[key] = date;
    }
    const characterBossIds = new Set();
    const bosses = raw.bosses.map(row => {
      if (!isPlainObject(row) || typeof row.bossId !== 'string' || typeof row.difficulty !== 'string') {
        fail(`${raw.name}의 보스 선택 항목이 올바르지 않습니다.`);
      }
      const boss = nextBossData.find(candidate => candidate.id === row.bossId);
      if (!boss || !boss.difficulties[row.difficulty]) fail(`${raw.name}에 알 수 없는 보스 또는 난이도가 있습니다.`);
      if (characterBossIds.has(row.bossId)) fail(`${raw.name}에 같은 보스가 중복되어 있습니다.`);
      characterBossIds.add(row.bossId);
      const { max } = getDifficultyEntry(boss, row.difficulty);
      return {
        rowId: typeof row.rowId === 'string' && row.rowId ? row.rowId : 'r_' + Math.random().toString(36).slice(2, 8),
        bossId: row.bossId,
        difficulty: row.difficulty,
        partyMembers: clampPartyMembers(row.partyMembers, max),
      };
    });
    return normalizeChar({
      id: raw.id.slice(0, 100),
      name: raw.name.trim().slice(0, 100),
      durations,
      bosses,
      equipment: cloneJson(raw.equipment || {}),
      goals: raw.goals ? cloneJson(raw.goals) : undefined,
      budget: raw.budget ? cloneJson(raw.budget) : emptyBudget(),
      bossTimes: raw.bossTimes ? cloneJson(raw.bossTimes) : {},
      hexaSkills: raw.hexaSkills ? cloneJson(raw.hexaSkills) : undefined,
    });
  });
  return { characters: nextCharacters, bossData: nextBossData, mileage: normalizeMileageState(value.mileage) };
};

/* =========================================================
 * 만료 알림 (브라우저 Notification + 페이지 배너)
 * - D-1, D-day, 만료 항목 노출
 * - 캐릭터·항목·만료일 조합마다 브라우저 알림은 한 번만 발송
 * ========================================================= */
const activeExpiryNotificationKeys = (characters, oldKeys) => {
  const activeKeys = new Set();
  for (const character of characters) {
    for (const [type, date] of Object.entries(character.durations || {})) {
      if (typeof date === 'string' && date) activeKeys.add(`${character.id}|${type}|${date}`);
    }
  }
  return [...new Set((oldKeys || [])
    .filter(key => typeof key === 'string')
    .map(key => key.split('|').slice(0, 3).join('|'))
    .filter(key => activeKeys.has(key)))];
};

function useExpiryNotifications(characters) {
  const [permission, setPermission] = useState(() =>
    typeof Notification !== 'undefined' ? Notification.permission : 'unsupported'
  );
  const [pending, setPending] = useState([]);

  // 만료/임박 항목 탐지
  useEffect(() => {
    const items = [];
    for (const c of characters) {
      for (const [k, v] of Object.entries(c.durations || {})) {
        if (!v) continue;
        const d = daysUntil(v);
        if (d === 0 || d === 1 || (d !== null && d < 0)) {
          items.push({
            charName: c.name,
            charId: c.id,
            type: k,
            typeLabel: TYPE_LABEL[k] || k,
            date: v,
            days: d,
          });
        }
      }
    }
    setPending(items);

    // 브라우저 알림 발송 (같은 만료 항목은 앱을 다시 열어도 한 번만)
    if (typeof Notification === 'undefined' || Notification.permission !== 'granted') return;
    const shown = loadLS(LS_KEYS.NOTIF_SHOWN, { keys: [] });
    const oldKeys = Array.isArray(shown) ? shown : (Array.isArray(shown?.keys) ? shown.keys : []);
    // 구버전 키의 마지막 D-day 값은 제거해 새 형식으로 이관한다.
    const nextKeys = activeExpiryNotificationKeys(characters, oldKeys);
    for (const it of items) {
      const key = `${it.charId}|${it.type}|${it.date}`;
      if (nextKeys.includes(key)) continue;
      const title =
        it.days < 0 ? `[만료됨] ${it.charName} - ${it.typeLabel}` :
        it.days === 0 ? `[오늘 만료] ${it.charName} - ${it.typeLabel}` :
        `[내일 만료] ${it.charName} - ${it.typeLabel}`;
      const body = `${it.typeLabel} 만료일: ${it.date}`;
      try {
        new Notification(title, { body, icon: 'icon.png', tag: key });
      } catch {}
      nextKeys.push(key);
    }
    // 현재 존재하는 만료 항목의 발송 기록은 개수와 무관하게 모두 보존한다.
    saveLS(LS_KEYS.NOTIF_SHOWN, { keys: nextKeys });
  }, [characters, permission]);

  const askPermission = () => {
    if (typeof Notification === 'undefined') return;
    Notification.requestPermission().then(p => setPermission(p)).catch(() => {});
  };

  return { pending, permission, askPermission };
}

 * 메인 App
 * ========================================================= */
// 새 마일리지: 금액 미공개 보스는 null로 유지해 0개와 구분한다.
const mileageInt = (value, max = 1000000000) => Math.min(max, safeNonNegativeInt(value));
const MILEAGE_BOSS_OPTIONS = DEFAULT_BOSSES.flatMap(boss => Object.keys(boss.difficulties)
  .map(difficulty => ({ key: `${boss.id}:${difficulty}`, bossId: boss.id, difficulty,
    name: boss.name, monthly: !!boss.monthly })));
const normalizeMileageState = (raw) => {
  const coins = isPlainObject(raw?.coins) ? raw.coins : {};
  const credit = isPlainObject(raw?.credit) ? raw.credit : {};
  const seen = new Set();
  const bosses = (Array.isArray(coins.bosses) ? coins.bosses : []).flatMap(row => {
    const option = MILEAGE_BOSS_OPTIONS.find(item => item.key === row?.key);
    if (!option || seen.has(option.key)) return [];
    seen.add(option.key);
    return [{ key: option.key, amount: row.amount == null || row.amount === '' ? null : mileageInt(row.amount),
      count: mileageInt(row.count, 200), received: mileageInt(row.received, 6) }];
  });
  return {
    coins: { days: coins.days == null ? 7 : mileageInt(coins.days, 31),
      weeks: coins.weeks == null ? 1 : mileageInt(coins.weeks, 6),
      balance: mileageInt(coins.balance), earned: mileageInt(coins.earned, 100000),
      elite: mileageInt(coins.elite, 5), mapleM: mileageInt(coins.mapleM, 700),
      collection: mileageInt(coins.collection), gift: mileageInt(coins.gift), pc: mileageInt(coins.pc), bosses },
    credit: { price: credit.price == null ? 10000 : mileageInt(credit.price),
      cashPaid: credit.cashPaid == null ? 10000 : mileageInt(credit.cashPaid),
      quantity: credit.quantity == null ? 1 : mileageInt(credit.quantity, 1000),
      gift: credit.gift === true, confirmed: credit.confirmed !== false,
      balance: mileageInt(credit.balance), target: credit.target == null ? 10000 : mileageInt(credit.target) },
  };
};
const mileageBossPlanFromCharacters = (characters, previousRows = []) => {
  const planned = new Map();
  for (const character of characters) {
    const seen = new Set();
    for (const row of character.bosses || []) {
      const key = `${row.bossId}:${row.difficulty}`;
      if (seen.has(key) || !MILEAGE_BOSS_OPTIONS.some(option => option.key === key)) continue;
      seen.add(key);
      planned.set(key, (planned.get(key) || 0) + 1);
    }
  }
  return [...planned].map(([key, count]) => ({ key, count,
    amount: previousRows.find(row => row.key === key)?.amount ?? null,
    received: previousRows.find(row => row.key === key)?.received || 0 }));
};
const calculateExplorationCoins = (raw) => {
  const input = normalizeMileageState({ coins: raw }).coins;
  const rows = input.bosses.map(row => {
    const option = MILEAGE_BOSS_OPTIONS.find(item => item.key === row.key);
    const cycles = option.monthly ? 1 : input.weeks;
    const eligible = cycles === 0 ? 0 : Math.max(0, Math.min(row.count, 6) - row.received)
      + Math.min(row.count, 6) * (cycles - 1);
    const remainingPlan = cycles === 0 ? 0 : Math.max(0, row.count - row.received) + row.count * (cycles - 1);
    return { ...row, ...option, eligible, excluded: remainingPlan - eligible,
      coins: (row.amount ?? 0) * eligible, unknown: row.amount == null && eligible > 0 };
  });
  const bossCoins = rows.reduce((sum, row) => sum + row.coins, 0);
  const eliteCoins = input.days * input.elite * 60;
  const mapleMCoins = input.days * input.mapleM;
  const planned = bossCoins + eliteCoins + mapleMCoins + input.collection;
  const remaining = Math.max(0, 100000 - input.earned);
  const capped = Math.min(remaining, planned);
  const exempt = input.gift + input.pc;
  return { rows, bossCoins, eliteCoins, mapleMCoins, planned, remaining, capped, exempt,
    overflow: planned - capped, total: capped + exempt, balance: input.balance + capped + exempt,
    monthEarned: input.earned + capped, unknownCount: rows.filter(row => row.unknown).length };
};
const calculateMapleCredit = (raw) => {
  const input = normalizeMileageState({ credit: raw }).credit;
  const cashPaid = Math.min(input.price, input.cashPaid);
  const eligible = input.price >= 10 && !input.gift;
  const expected = eligible ? cashPaid * input.quantity / 20 : 0;
  const credited = input.confirmed ? expected : 0;
  // 캐시 단위 정수로 먼저 계산해 부족액을 환산할 때의 소수점 오차를 피한다.
  const creditedCash = eligible && input.confirmed ? cashPaid * input.quantity : 0;
  const available = (input.balance * 20 + creditedCash) / 20;
  const shortageCash = Math.max(0, (input.target - input.balance) * 20 - creditedCash);
  const shortage = shortageCash / 20;
  return { cashTotal: cashPaid * input.quantity, eligible, expected, credited,
    pending: expected - credited, available, shortage,
    extraCash: shortageCash > 0 ? Math.max(10, shortageCash) : 0 };
};

function App() {
  const [characters, setCharacters] = useState(() => {
    const saved = loadLS(LS_KEYS.CHARS, []);
    return Array.isArray(saved) ? saved.filter(isPlainObject).map(normalizeChar) : [];
  });
  const [bossData, setBossData]     = useState(() => reconcileBossData(loadLS(LS_KEYS.BOSS_DATA, null)));
  const [selected, setSelected]     = useState(() => loadLS(LS_KEYS.SELECTED, 'dashboard'));
  const [mileage, setMileage] = useState(() => normalizeMileageState(loadLS(LS_KEYS.MILEAGE, null)));
  const [sidebarOpen, setSidebarOpen] = useState(false);
  const menuButtonRef = useRef(null);
  const sidebarWasOpen = useRef(false);

  useEffect(() => saveLS(LS_KEYS.CHARS, characters), [characters]);
  useEffect(() => saveLS(LS_KEYS.BOSS_DATA, bossData), [bossData]);
  useEffect(() => saveLS(LS_KEYS.SELECTED, selected), [selected]);
  useEffect(() => saveLS(LS_KEYS.MILEAGE, mileage), [mileage]);
  useEffect(() => {
    window.scrollTo({ top: 0, behavior: 'auto' });
  }, [selected]);

  // 최대 인원 보정과 함께 구버전/손상 데이터의 중복·알 수 없는 보스도 정리한다.
  useEffect(() => {
    setCharacters(prev => {
      let changed = false;
      const next = prev.map(character => {
        let characterChanged = !Array.isArray(character.bosses);
        if (characterChanged) changed = true;
        const seenBossIds = new Set();
        const bosses = [];
        for (const row of (Array.isArray(character.bosses) ? character.bosses : [])) {
          if (!isPlainObject(row)) {
            characterChanged = true;
            changed = true;
            continue;
          }
          const boss = bossData.find(candidate => candidate.id === row.bossId);
          if (!boss || !boss.difficulties[row.difficulty] || seenBossIds.has(row.bossId)) {
            characterChanged = true;
            changed = true;
            continue;
          }
          seenBossIds.add(row.bossId);
          const { max } = getDifficultyEntry(boss, row.difficulty);
          const members = clampPartyMembers(row.partyMembers, max);
          if (members !== row.partyMembers) {
            changed = true;
            characterChanged = true;
            bosses.push({ ...row, partyMembers: members });
          } else {
            bosses.push(row);
          }
        }
        return characterChanged ? { ...character, bosses } : character;
      });
      return changed ? next : prev;
    });
  }, [bossData]);

  useEffect(() => {
    if (sidebarWasOpen.current && !sidebarOpen) {
      requestAnimationFrame(() => menuButtonRef.current?.focus());
    }
    sidebarWasOpen.current = sidebarOpen;
  }, [sidebarOpen]);
  useEffect(() => {
    if (!sidebarOpen) return;
    const closeOnEscape = (event) => { if (event.key === 'Escape') setSidebarOpen(false); };
    document.addEventListener('keydown', closeOnEscape);
    return () => document.removeEventListener('keydown', closeOnEscape);
  }, [sidebarOpen]);

  const { pending, permission, askPermission } = useExpiryNotifications(characters);

  // 캐릭터별 총 수익 계산 (주간 / 월간 분리)
  const charTotals = useMemo(() => {
    const map = {};
    for (const c of characters) {
      let weekly = 0, monthly = 0;
      for (const row of (c.bosses || [])) {
        const boss = bossData.find(b => b.id === row.bossId);
        if (!boss) continue;
        const { revenue: rev } = getBossRevenue(boss, row);
        if (boss.monthly) monthly += rev;
        else weekly += rev;
      }
      map[c.id] = { weekly, monthly, total: weekly + monthly };
    }
    return map;
  }, [characters, bossData]);

  const grandTotal = useMemo(
    () => Object.values(charTotals).reduce(
      (a, t) => ({
        weekly: a.weekly + t.weekly,
        monthly: a.monthly + t.monthly,
        total: a.total + t.total,
      }),
      { weekly: 0, monthly: 0, total: 0 }
    ),
    [charTotals]
  );

  const addCharacter = useCallback((name) => {
    const newChar = {
      id: uid(),
      name: name?.trim() || `캐릭터${characters.length + 1}`,
      durations: {
        pet: '',
        label_hat: '', label_clothes: '', label_shoes: '', label_cape: '', label_weapon: '',
        specialCore: '',
      },
      bosses: [],
      equipment: {},
      goals: emptyGoals(),
      budget: emptyBudget(),
    };
    setCharacters(prev => [...prev, newChar]);
    setSelected(newChar.id);
    setSidebarOpen(false);
  }, [characters]);

  const removeCharacter = useCallback((id) => {
    if (!confirm('이 캐릭터를 삭제할까요? 되돌릴 수 없습니다.')) return;
    setCharacters(prev => prev.filter(c => c.id !== id));
    setSelected('dashboard');
  }, []);

  const updateCharacter = useCallback((id, updater) => {
    setCharacters(prev => prev.map(c => c.id === id ? updater(c) : c));
  }, []);

  // 예산 복사/붙여넣기 (다른 캐릭터로)
  const [budgetClip, setBudgetClip] = useState(() => loadLS('maple_budget_clip', null));
  const copyBudget = useCallback((id) => {
    setCharacters(prev => {
      const c = prev.find(x => x.id === id);
      if (c) {
        const clip = {
          equipment: JSON.parse(JSON.stringify(c.equipment || {})),
          goals: JSON.parse(JSON.stringify(c.goals || emptyGoals())),
          budget: JSON.parse(JSON.stringify(normalizeBudget(c.budget))),
          hexaSkills: JSON.parse(JSON.stringify(c.hexaSkills || emptyHexa())),
          from: c.name,
        };
        setBudgetClip(clip);
        saveLS('maple_budget_clip', clip);
      }
      return prev;
    });
  }, []);
  const pasteBudget = useCallback((id) => {
    if (!budgetClip) return;
    if (!confirm(`'${budgetClip.from}'의 예산을 이 캐릭터에 덮어쓸까요? (현재 예산 내용이 사라집니다)`)) return;
    setCharacters(prev => prev.map(c => c.id === id ? normalizeChar({
      ...c,
      equipment: JSON.parse(JSON.stringify(budgetClip.equipment || {})),
      goals: JSON.parse(JSON.stringify(budgetClip.goals || emptyGoals())),
      budget: JSON.parse(JSON.stringify(normalizeBudget(budgetClip.budget))),
      hexaSkills: JSON.parse(JSON.stringify(budgetClip.hexaSkills || emptyHexa())),
    }) : c));
  }, [budgetClip]);

  // 데이터 백업: JSON 파일 내보내기 / 가져오기
  const exportData = useCallback(() => {
    const data = { app: 'maple-check', version: 1, exportedAt: todayStr(), characters, bossData, mileage };
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `maple-check-backup-${todayStr()}.json`;
    a.click();
    URL.revokeObjectURL(url);
  }, [characters, bossData, mileage]);

  const importDataFile = useCallback((file) => {
    if (!file) return;
    if (file.size > 5 * 1024 * 1024) {
      alert('백업 파일이 너무 큽니다. (최대 5MB)');
      return;
    }
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const j = JSON.parse(reader.result);
        // 모든 구조 검증과 정규화를 끝낸 뒤에만 현재 상태를 변경한다.
        const next = validateBackupData(j);
        if (!confirm(`백업 불러오기: ${j.exportedAt || '날짜 미상'} · 캐릭터 ${j.characters.length}명\n현재 이 브라우저의 데이터를 덮어씁니다. 진행할까요?`)) return;
        setCharacters(next.characters);
        setBossData(next.bossData);
        setMileage(next.mileage);
        setSelected('dashboard');
        alert('불러오기 완료!');
      } catch (error) {
        alert(`백업을 불러올 수 없습니다.\n${error?.message || 'JSON 형식 오류'}`);
      }
    };
    reader.onerror = () => alert('백업 파일을 읽는 중 오류가 발생했습니다.');
    reader.readAsText(file);
  }, []);

  return (
    <div className="flex h-full w-full overflow-hidden">
      {sidebarOpen && (
        <div
          className="fixed inset-0 bg-black/60 z-30 md:hidden"
          onClick={() => setSidebarOpen(false)}
          aria-hidden="true"
        />
      )}

      <Sidebar
        characters={characters}
        charTotals={charTotals}
        selected={selected}
        onSelect={(id) => { setSelected(id); setSidebarOpen(false); }}
        onAdd={addCharacter}
        onRemove={removeCharacter}
        open={sidebarOpen}
        onExport={exportData}
        onImportFile={importDataFile}
      />

      <main className="flex-1 overflow-y-auto">
        <header className="sticky top-0 z-20 bg-maple-bg/80 backdrop-blur border-b border-maple-border px-4 py-3 flex items-center gap-3 md:hidden">
          <button
            ref={menuButtonRef}
            onClick={() => setSidebarOpen(true)}
            className="p-2 -ml-2 rounded hover:bg-maple-panel"
            aria-label="메뉴"
            aria-expanded={sidebarOpen}
            aria-controls="app-sidebar"
          >
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
              <path d="M3 6h18M3 12h18M3 18h18" />
            </svg>
          </button>
          <h1 className="text-lg font-bold text-maple-accent flex items-center gap-2">
            <img src="icon.png" alt="" className="w-7 h-7 rounded-lg object-cover" /> 메이플 체크
          </h1>
        </header>

        <div className="p-4 md:p-8">
          <div className="mb-5 max-w-5xl mx-auto rounded-xl border border-amber-500/30 bg-amber-500/10 px-4 py-3 text-sm text-amber-100 leading-relaxed">
            <strong>9/10 테스트월드 개편 후 계산</strong> · 결정석 가격·아케인 비용·캐릭터당 판매 제한 삭제를 미리 반영했습니다.
            검은 마법사는 <strong>10/1 적용 예정 가격</strong>으로 계산합니다. 그 외 개편은 9/17 예정이며 정식 업데이트에서 변경될 수 있습니다.
            {' '}<a href={REWORK_SOURCE_URL} target="_blank" rel="noopener noreferrer" className="underline underline-offset-2">공식 공지</a>
          </div>
          {/* 상단 알림 배너: D-1 / D-day / 만료됨 */}
          {pending.length > 0 && (
            <ExpiryBanner
              items={pending}
              permission={permission}
              onAskPermission={askPermission}
              onSelect={(id) => setSelected(id)}
            />
          )}

          {selected === 'dashboard' && (
            <Dashboard
              characters={characters}
              charTotals={charTotals}
              grandTotal={grandTotal}
              bossData={bossData}
              onSelect={setSelected}
            />
          )}
          {selected === 'boss_data' && (
            <BossDataEditor bossData={bossData} setBossData={setBossData} />
          )}
          {selected === 'boss_history' && (
            <BossHistoryView />
          )}
          {selected === 'symbol_price' && (
            <SymbolPriceView />
          )}
          {selected === 'enhance_calc' && (
            <EnhanceCalcView />
          )}
          {selected === 'mileage_calc' && (
            <MileageView characters={characters} value={mileage} onChange={setMileage} />
          )}
          {selected === 'sunday_maple' && (
            <SundayMapleView />
          )}
          {selected === 'budget_summary' && (
            <BudgetSummaryView characters={characters} charTotals={charTotals} onSelect={setSelected} />
          )}
          {characters.find(c => c.id === selected) && (
            <CharacterView
              character={characters.find(c => c.id === selected)}
              bossData={bossData}
              totals={charTotals[selected] || { weekly: 0, monthly: 0, total: 0 }}
              onUpdate={(updater) => updateCharacter(selected, updater)}
              onRemove={() => removeCharacter(selected)}
              onCopyBudget={() => copyBudget(selected)}
              onPasteBudget={() => pasteBudget(selected)}
              budgetClip={budgetClip}
            />
          )}
        </div>

        <footer className="px-6 py-8 text-center text-xs text-slate-500">
          메이플 체크 · 데이터는 이 브라우저에만 저장됩니다 · {new Date().getFullYear()}
        </footer>
      </main>
    </div>
  );
}

/* =========================================================
 * 상단 만료 알림 배너 (D-1 / D-day / 만료됨)

function ExpiryBanner({ items, permission, onAskPermission, onSelect }) {
  return (
    <div className="mb-6 max-w-5xl mx-auto bg-red-500/10 border border-red-500/40 rounded-xl p-4 md:p-5">
      <div className="flex items-start justify-between gap-3 flex-wrap">
        <h3 className="font-bold text-maple-danger flex items-center gap-2">
          <span>🔔</span> 만료 알림
        </h3>
        {permission !== 'granted' && permission !== 'unsupported' && (
          <button
            onClick={onAskPermission}
            className="text-xs bg-maple-danger/20 hover:bg-maple-danger/30 border border-red-500/40 text-red-200 px-3 py-1 rounded"
          >
            브라우저 알림 허용
          </button>
        )}
      </div>
      <div className="mt-3 space-y-2">
        {items.map((it, i) => {
          const tone =
            it.days < 0 ? 'text-maple-danger' :
            it.days === 0 ? 'text-maple-danger' :

          const tag =

            '내일 만료';

            <button
              key={i}

            >

                <span className="font-medium">{it.charName}</span>
                <span className="text-slate-500 mx-2">·</span>

              <div className={`text-sm font-bold ${tone}`}>
                {tag} <span className="text-slate-500 font-normal text-xs ml-1">{it.date}</span>
              </div>
            </button>
          );
        })}
      </div>
    </div>
  );
}

function Sidebar({ characters, charTotals, selected, onSelect, onAdd, onRemove, open, onExport, onImportFile }) {
  const [newName, setNewName] = useState('');
  const asideRef = useRef(null);

  useEffect(() => {
    if (!open) return;
    const aside = asideRef.current;
    const focusable = () => Array.from(aside?.querySelectorAll(
      'button:not([disabled]), input:not([disabled]), select:not([disabled]), a[href], [tabindex]:not([tabindex="-1"])'
    ) || []);
    const isDesktop = () => window.matchMedia('(min-width: 768px)').matches;
    const frame = requestAnimationFrame(() => { if (!isDesktop()) focusable()[0]?.focus(); });
    const trapFocus = (event) => {
      if (event.key !== 'Tab' || isDesktop()) return;
      const items = focusable();
      if (!items.length) return;
      const first = items[0], last = items[items.length - 1];
      if (!aside?.contains(document.activeElement)) {
        event.preventDefault();
        (event.shiftKey ? last : first).focus();
      } else if (event.shiftKey && document.activeElement === first) {
        event.preventDefault();
        last.focus();
      } else if (!event.shiftKey && document.activeElement === last) {
        event.preventDefault();
        first.focus();
      }
    };
    document.addEventListener('keydown', trapFocus);
    return () => {
      cancelAnimationFrame(frame);
      document.removeEventListener('keydown', trapFocus);
    };
  }, [open]);

  const handleAdd = (e) => {
    e?.preventDefault();
    onAdd(newName);
    setNewName('');
  };

  return (
    <aside

      <nav className="flex-1 overflow-y-auto px-3 py-3 space-y-1">

        <NavItem

        {characters.length === 0 && (
          <div className="px-2 py-3 text-sm text-slate-500">

        {characters.map(c => (
          <NavItem
            key={c.id}
            active={selected === c.id}
            onClick={() => onSelect(c.id)}
            label={`👤 ${c.name}`}
            subtitle={`주간 ${fmtMeso(charTotals[c.id]?.weekly || 0)}`}
            secondarySubtitle={`월간 1회 ${fmtMeso(charTotals[c.id]?.monthly || 0)}`}

        <div className="pt-4 pb-1 px-2 text-xs uppercase tracking-wider text-slate-500">

        </div>
        <NavItem
          active={selected === 'boss_data'}

        />
        <NavItem
          active={selected === 'boss_history'}

          subtitle="가격 변동 이력 보기"

        <NavItem
          active={selected === 'symbol_price'}

        <NavItem

        <NavItem

        <NavItem
          active={selected === 'sunday_maple'}

        <div className="pt-4 pb-1 px-2 text-xs uppercase tracking-wider text-slate-500">
          데이터 백업
        </div>
        <div className="flex gap-2 px-2">
          <button

            onClick={onExport}

            title="모든 데이터를 JSON 파일로 저장"

            />
          </label>
        </div>
        <p className="px-2 pt-1 text-[10px] text-slate-600 leading-snug">
          데이터는 이 브라우저에만 저장됩니다. 다른 기기로 옮기거나 백업할 때 사용하세요.
        </p>
      </nav>

      <form onSubmit={handleAdd} className="p-3 border-t border-maple-border space-y-2">
        <input
          type="text"
          value={newName}
          onChange={(e) => setNewName(e.target.value)}
          placeholder="새 캐릭터 이름"
          aria-label="새 캐릭터 이름"
          className="w-full bg-maple-bg border border-maple-border rounded px-3 py-2 text-sm focus:outline-none focus:border-maple-accent"
        />
        <button
          type="submit"

  );
}

/* =========================================================
 * Dashboard (총 통합 정리)
 * ========================================================= */
function Dashboard({ characters, charTotals, grandTotal, bossData, onSelect }) {
  const expiring = useMemo(() => {
    const items = [];
    for (const c of characters) {
      for (const [k, v] of Object.entries(c.durations || {})) {
        if (!v) continue;
        const d = daysUntil(v);
        if (d !== null && d <= 30) {
          items.push({ char: c.name, charId: c.id, type: k, date: v, days: d });
        }
      }
    }
    return items.sort((a, b) => a.days - b.days);
  }, [characters]);

  return (
    <div className="max-w-5xl mx-auto space-y-6">
      <div>
        <h2 className="text-2xl md:text-3xl font-bold">📊 총 통합 정리</h2>
        <p className="text-slate-400 mt-1">모든 캐릭터의 주간 수익과 월간 보스 1회 수익을 합산</p>
      </div>

      <div className="bg-gradient-to-br from-amber-500/20 to-orange-500/10 border border-maple-accent/30 rounded-xl p-6 md:p-8">
        <div className="text-sm text-slate-300">주간 + 월간 1회 보스 결정석 수익</div>
        <div className="text-3xl md:text-5xl font-bold text-maple-accent mt-2 break-all">
          {fmtMeso(grandTotal.total)}
        </div>
        <div className="grid grid-cols-2 gap-3 mt-4">
          <div className="bg-maple-bg/40 rounded-lg px-4 py-3">
            <div className="text-xs text-slate-400">주간 수익</div>
            <div className="text-base md:text-xl font-bold text-sky-300 mt-0.5 break-all">{fmtMeso(grandTotal.weekly)}</div>

/* =========================================================
 * CharacterView (개별 캐릭터)
 * ========================================================= */
function CharacterView({ character, bossData, totals, onUpdate, onRemove, onCopyBudget, onPasteBudget, budgetClip }) {
  const [editName, setEditName] = useState(false);
  const [nameInput, setNameInput] = useState(character.name);
  const [tab, setTab] = useState('boss');

  useEffect(() => { setNameInput(character.name); setTab('boss'); }, [character.id]);

  const setDuration = (key, value) => {
    onUpdate(c => ({ ...c, durations: { ...c.durations, [key]: value } }));
  };

  const setEquipSlot = (slotId, patch) => {
    onUpdate(c => ({
      ...c,
      equipment: {
        ...c.equipment,
        [slotId]: { ...emptyEquipSlot(), ...(c.equipment?.[slotId] || {}), ...patch },
      },
    }));
  };
  const clearEquipSlot = (slotId) => {
    onUpdate(c => {
      const next = { ...c.equipment };
      delete next[slotId];
      const currentBudget = normalizeBudget(c.budget);
      const savedByItem = { ...currentBudget.savedByItem };
      delete savedByItem['eq_' + slotId];
      return { ...c, equipment: next, budget: { ...currentBudget, savedByItem } };
    });
  };
  const setGoals = (updater) => {
    onUpdate(c => ({ ...c, goals: updater(c.goals || emptyGoals()) }));
  };
  const setBudget = (updater) => {
    onUpdate(c => {
      const current = normalizeBudget(c.budget);
      const next = typeof updater === 'function' ? updater(current) : updater;
      return { ...c, budget: normalizeBudget(next) };
    });
  };
  const setHexa = (updater) => {
    onUpdate(c => ({ ...c, hexaSkills: updater(c.hexaSkills || emptyHexa()) }));
  };

  const toggleBoss = (bossId, difficulty) => {
    onUpdate(c => {
      // 현재 보스 목록에 없는(일간 전환 등으로 제거된) 보스 선택은 정리
      let list = (c.bosses || []).filter(b => bossData.find(x => x.id === b.bossId));
      const boss = bossData.find(b => b.id === bossId);
      const idx = list.findIndex(b => b.bossId === bossId && b.difficulty === difficulty);
      if (idx >= 0) {
        // 선택 해제
        return { ...c, bosses: list.filter((_, i) => i !== idx) };
      }
      // 같은 보스는 한 난이도만 선택 가능 → 같은 보스의 다른 난이도는 자동 해제
      list = list.filter(b => b.bossId !== bossId);
      return {
        ...c,
        bosses: [...list, {
          rowId: 'r_' + Math.random().toString(36).slice(2, 8),
          bossId, difficulty, partyMembers: 1
        }]
      };
    });
  };

  const setBossMembers = (bossId, difficulty, n) => {
    const boss = bossData.find(candidate => candidate.id === bossId);
    const { max } = getDifficultyEntry(boss, difficulty);
    const members = clampPartyMembers(n, max);
    onUpdate(c => ({
      ...c,
      bosses: (c.bosses || []).map(b =>
        (b.bossId === bossId && b.difficulty === difficulty)
          ? { ...b, partyMembers: members }
          : b
      )
    }));
  };

  const resetBosses = () => {
    if (!confirm('이 캐릭터의 보스 선택(주간·월간)을 모두 초기화할까요?')) return;
    onUpdate(c => ({ ...c, bosses: [] }));
  };

  // 보스 소요시간(분) — 캐릭터별로 저장
  const setBossTime = (bossId, minutes) => {
    onUpdate(c => ({ ...c, bossTimes: { ...(c.bossTimes || {}), [bossId]: minutes } }));
  };

  // 선택 보스 기준 소요시간 합산 (상단 카드 표시용)
  const bossTimeSum = useMemo(() => {
    let w = 0, mb = 0;
    const times = character.bossTimes || {};
    for (const r of (character.bosses || [])) {
      const boss = bossData.find(b => b.id === r.bossId);
      if (!boss) continue;
      const t = Math.max(0, times[r.bossId] || 0);
      if (boss.monthly) mb += t; else w += t;
    }
    return { weekly: w, monthly: w * 4 + mb };
  }, [character.bosses, character.bossTimes, bossData]);

  const saveName = () => {
    const v = nameInput.trim();
    if (v) onUpdate(c => ({ ...c, name: v }));
    setEditName(false);
  };

  return (
    <div className="max-w-5xl mx-auto space-y-6">
      <div className="flex items-start justify-between flex-wrap gap-3">
        <div>
          {editName ? (
            <div className="flex gap-2">
              <input
                value={nameInput}
                onChange={(e) => setNameInput(e.target.value)}
                onKeyDown={(e) => e.key === 'Enter' && saveName()}
                autoFocus
                className="bg-maple-panel border border-maple-border rounded px-3 py-1.5 text-xl font-bold focus:outline-none focus:border-maple-accent"
              />
              <button onClick={saveName} className="bg-maple-accent text-slate-900 px-3 rounded font-medium">저장</button>
            </div>
          ) : (
            <h2
              className="text-2xl md:text-3xl font-bold flex items-center gap-2 cursor-pointer hover:text-maple-accent"
              onClick={() => setEditName(true)}
              title="클릭해서 이름 수정"
            >
              👤 {character.name}
              <span className="text-xs text-slate-500 font-normal">(클릭해서 수정)</span>
            </h2>
          )}
          <p className="text-slate-400 mt-1">보스 수익 & 기간제 아이템 관리</p>
        </div>
        <button
          onClick={onRemove}
          className="text-sm text-maple-danger hover:bg-red-500/10 px-3 py-1.5 rounded border border-red-500/30"
        >
          캐릭터 삭제
        </button>
      </div>

      {/* 탭 전환: 보스 수익 / 예산 플래너 / 기간제 */}
      <div className="flex items-center gap-1 bg-maple-panel border border-maple-border rounded-lg p-1 w-fit flex-wrap">
        <TabBtn active={tab === 'boss'} onClick={() => setTab('boss')}>💎 보스 수익</TabBtn>
        <TabBtn active={tab === 'budget'} onClick={() => setTab('budget')}>🧮 예산 플래너</TabBtn>
        <TabBtn active={tab === 'duration'} onClick={() => setTab('duration')}>📅 기간제</TabBtn>
      </div>

      {tab === 'boss' && (
        <>
          <div className="bg-gradient-to-br from-amber-500/15 to-orange-500/5 border border-maple-accent/30 rounded-xl p-5">
            <div className="text-sm text-slate-300">이 캐릭터의 주간 + 월간 1회 보스 수익</div>
            <div className="text-2xl md:text-4xl font-bold text-maple-accent mt-1 break-all">
              {fmtMeso(totals.total)}
            </div>
            <div className="grid grid-cols-2 gap-3 mt-4">
              <div className="bg-maple-bg/40 rounded-lg px-4 py-3">
                <div className="text-xs text-slate-400">주간 수익</div>
                <div className="text-base md:text-lg font-bold text-sky-300 mt-0.5 break-all">{fmtMeso(totals.weekly)}</div>
                <div className="text-xs text-slate-400 mt-1">주간 소요시간 <span className="text-sky-200/80 font-medium">{fmtMinutes(bossTimeSum.weekly)}</span></div>
              </div>
              <div className="bg-maple-bg/40 rounded-lg px-4 py-3">
                <div className="text-xs text-slate-400">월간 수익</div>
                <div className="text-base md:text-lg font-bold text-violet-300 mt-0.5 break-all">{fmtMeso(totals.monthly)}</div>
                <div className="text-xs text-slate-400 mt-1">월간 소요시간 <span className="text-violet-200/80 font-medium">{fmtMinutes(bossTimeSum.monthly)}</span></div>
              </div>
            </div>
          </div>

          <BossRevenueTable
            rows={character.bosses || []}
            bossData={bossData}
            bossTimes={character.bossTimes || {}}
            onToggle={toggleBoss}
            onSetMembers={setBossMembers}
            onReset={resetBosses}
            onSetTime={setBossTime}
          />
        </>
      )}

      {tab === 'duration' && (
        <DurationsPanel durations={character.durations || {}} setDuration={setDuration} />
      )}

      {tab === 'budget' && (
        <>
          <div className="flex items-center justify-end gap-2">
            <button onClick={onCopyBudget}
              className="text-xs bg-maple-bg border border-maple-border hover:border-maple-accent/60 px-3 py-1.5 rounded text-slate-200">📋 예산 복사</button>
            <button onClick={onPasteBudget} disabled={!budgetClip}
              className="text-xs bg-maple-bg border border-maple-border hover:border-maple-accent/60 px-3 py-1.5 rounded text-slate-200 disabled:opacity-40 disabled:cursor-not-allowed">
              📥 붙여넣기{budgetClip ? ` (${budgetClip.from})` : ''}
            </button>
          </div>
          <BudgetPlanner
            character={character}
            totals={totals}
            setEquipSlot={setEquipSlot}
            clearEquipSlot={clearEquipSlot}
            setGoals={setGoals}
            setBudget={setBudget}
            setHexa={setHexa}
          />
        </>
      )}
    </div>
  );
}

function TabBtn({ active, onClick, children }) {
  return (
    <button
      onClick={onClick}
      className={`text-sm px-3 py-1.5 rounded-md transition whitespace-nowrap ${
        active ? 'bg-maple-accent text-slate-900 font-semibold' : 'text-slate-300 hover:bg-maple-bg'
      }`}
    >
      {children}

  );
}

  const d = daysUntil(value);
  const tone = d === null ? 'text-slate-500'
    : d < 0 ? 'text-maple-danger'
    : d <= 1 ? 'text-maple-danger'
    : d <= 7 ? 'text-maple-warn'
    : 'text-maple-good';
  return (
    <div>
      <label htmlFor={id} className="text-sm text-slate-300 block mb-1.5">{label}</label>
      <input
        id={id}
        type="date"
        value={value}
        onChange={(e) => onChange(e.target.value)}
        className="w-full bg-maple-bg border border-maple-border rounded px-3 py-2 text-sm focus:outline-none focus:border-maple-accent"
      />
      <div className={`text-xs mt-1 ${tone}`}>
        {d === null ? '미입력'
          : d < 0 ? `만료됨 (${-d}일 지남)`

          : d === 1 ? '🔔 내일 만료'
          : `${d}일 남음`}

    </div>
  );
}

/* =========================================================
 * 보스 수익 테이블
 * ========================================================= */
const DIFF_ORDER = { 'Easy': 0, 'Normal': 1, 'Hard': 2, 'Chaos': 3, 'Extreme': 4 };

// 난이도별 색상: off=미선택(연한), on=선택(진한)
const DIFF_STYLE = {
  'Easy':    { off: 'bg-emerald-500/15 text-emerald-300 border-emerald-500/40', on: 'bg-emerald-500 text-slate-900 border-emerald-300' },
  'Normal':  { off: 'bg-sky-500/15 text-sky-300 border-sky-500/40',             on: 'bg-sky-500 text-slate-900 border-sky-300' },
  'Hard':    { off: 'bg-pink-500/15 text-pink-300 border-pink-500/40',           on: 'bg-pink-500 text-slate-900 border-pink-300' },
  'Chaos':   { off: 'bg-orange-500/15 text-orange-300 border-orange-500/40',     on: 'bg-orange-500 text-slate-900 border-orange-300' },
  'Extreme': { off: 'bg-red-500/15 text-red-300 border-red-500/40',             on: 'bg-red-500 text-white border-red-300' },
};
const diffStyle = (diff) => DIFF_STYLE[diff] || { off: 'bg-slate-500/15 text-slate-300 border-slate-500/40', on: 'bg-slate-400 text-slate-900 border-slate-200' };
const DIFF_LETTER = { 'Easy': 'E', 'Normal': 'N', 'Hard': 'H', 'Chaos': 'C', 'Extreme': 'X' };

// 캐릭터별 보스 미니 표기 (아이콘 + 난이도 글자 + 파티원)
function BossMiniStrip({ bosses, bossData }) {
  const order = bossData.map(b => b.id);
  const rows = (bosses || [])
    .map(r => ({ r, boss: bossData.find(b => b.id === r.bossId) }))
    .filter(x => x.boss)
    .sort((a, b) => order.indexOf(a.r.bossId) - order.indexOf(b.r.bossId));
  if (!rows.length) return null;
  return (
    <div className="flex flex-wrap gap-1.5 mt-2">
      {rows.map(({ r, boss }) => {
        const st = diffStyle(r.difficulty);
        return (
          <div key={boss.id + '_' + r.difficulty} className="relative flex-shrink-0" title={`${boss.name} · ${r.difficulty}${r.partyMembers > 1 ? ` · ${r.partyMembers}인` : ''}`}>
            <BossIcon id={boss.id} name={boss.name} icon={boss.icon} />
            <span className={`absolute -bottom-1 left-1/2 -translate-x-1/2 text-[8px] font-extrabold leading-none px-1 py-px rounded border ${st.on}`}>{DIFF_LETTER[r.difficulty] || '?'}</span>
            {r.partyMembers > 1 && (
              <span className="absolute -top-1 -right-1 w-3.5 h-3.5 flex items-center justify-center text-[8px] font-bold text-white bg-slate-900/90 border border-slate-500 rounded-full">{r.partyMembers}</span>
            )}
          </div>
        );
      })}
    </div>
  );
}

function DifficultyBadge({ difficulty }) {
  const style = diffStyle(difficulty).off;
  return (
    <span className={`text-[10px] font-bold tracking-wider uppercase px-2 py-0.5 rounded border ${style}`}>
      {difficulty}
    </span>
  );
}

function SortBtn({ active, onClick, children }) {
  return (
    <button
      onClick={onClick}
      className={`text-xs px-2.5 py-1 rounded transition ${
        active ? 'bg-maple-accent text-slate-900 font-semibold' : 'text-slate-300 hover:text-white'
      }`}
    >
      {children}
