}

/* 보스 아이콘: icons/{id}.png 가 있으면 표시, 없으면 컬러 배지로 폴백 */
const ICON_GRADIENTS = [
  'from-rose-500 to-rose-800',
  'from-amber-500 to-amber-800',
  'from-emerald-500 to-emerald-800',
  'from-sky-500 to-sky-800',
  'from-violet-500 to-violet-800',
  'from-pink-500 to-pink-800',
  'from-cyan-500 to-cyan-800',
  'from-orange-500 to-orange-800',
];

function BossIcon({ id, name, icon }) {
  const [failed, setFailed] = useState(false);
  if (icon && !failed) {
    return (
      <img
        src={icon}
        alt=""
        onError={() => setFailed(true)}
        className="w-8 h-8 rounded object-cover bg-maple-bg flex-shrink-0"
      />
    );
  }
  const hash = [...(id || name || '')].reduce((a, c) => a + c.charCodeAt(0), 0);
  const grad = ICON_GRADIENTS[hash % ICON_GRADIENTS.length];
  return (
    <div className={`w-8 h-8 rounded bg-gradient-to-br ${grad} flex items-center justify-center text-sm font-bold text-white flex-shrink-0`}>
      {(name || '?').slice(0, 1)}
    </div>
  );
}

function BossRevenueTable({ rows, bossData, bossTimes = {}, onToggle, onSetMembers, onReset, onSetTime }) {
  const [sortMode, setSortMode] = useState('natural');

  // 보스당 선택된 난이도 (보스당 1개) — 현재 보스 목록에 있는 것만 (제거된 보스 무시)
  const selByBoss = useMemo(() => {
    const valid = new Set(bossData.map(b => b.id));
    const m = {};
    for (const r of rows) if (valid.has(r.bossId)) m[r.bossId] = r;
    return m;
  }, [rows, bossData]);

  const monthlyIds = useMemo(() => {
    const s = new Set();
    for (const b of bossData) if (b.monthly) s.add(b.id);
    return s;
  }, [bossData]);

  // 보스별 묶음 (난이도 배지 정렬)
  const bossList = useMemo(() => {
    const list = bossData.map(boss => {
      const diffs = Object.keys(boss.difficulties).map(diff => {
        const { price, max } = getDifficultyEntry(boss, diff);
        return { diff, price, max };
      });
      diffs.sort((a, b) => (DIFF_ORDER[a.diff] ?? 99) - (DIFF_ORDER[b.diff] ?? 99));
      const maxPrice = diffs.reduce((a, d) => Math.max(a, d.price), 0);
      return { boss, diffs, maxPrice, monthly: !!boss.monthly };
    });
    return list;
  }, [bossData]);

  // 가격순: 보스×난이도를 펼쳐서 가격순으로만 정렬
  const flatEntries = useMemo(() => {
    const arr = [];
    for (const boss of bossData) {
      for (const diff of Object.keys(boss.difficulties)) {
        const { price, max } = getDifficultyEntry(boss, diff);
        arr.push({ boss, diff, price, max, monthly: !!boss.monthly });
      }
    }
    arr.sort((a, b) => sortMode === 'price_asc' ? a.price - b.price : b.price - a.price);
    return arr;
  }, [bossData, sortMode]);

  const selectedRows = Object.values(selByBoss);
  const weeklyCount = selectedRows.filter(r => !monthlyIds.has(r.bossId)).length;
  const monthlyCount = selectedRows.filter(r => monthlyIds.has(r.bossId)).length;

  const revenue = useMemo(() => {
    let weekly = 0, monthly = 0;
    for (const r of rows) {
      const boss = bossData.find(b => b.id === r.bossId);
      if (!boss) continue;
      const { revenue: rev } = getBossRevenue(boss, r);
      if (boss.monthly) monthly += rev;
      else weekly += rev;
    }
    return { weekly, monthly, total: weekly + monthly };
  }, [rows, bossData]);

  // 소요시간 합산: 선택된 보스 기준
  // 주간 소요 = 주간보스 시간 합 / 월간 소요 = 주간 소요 ×4 + 월간보스 시간 합
  const timeSum = useMemo(() => {
    let weeklyT = 0, monthlyBossT = 0;
    for (const r of selectedRows) {
      const boss = bossData.find(b => b.id === r.bossId);
      if (!boss) continue;
      const t = Math.max(0, bossTimes[boss.id] || 0);
      if (boss.monthly) monthlyBossT += t; else weeklyT += t;
    }
    return { weekly: weeklyT, monthly: weeklyT * 4 + monthlyBossT };
  }, [selectedRows, bossData, bossTimes]);

  return (
    <div className="relative bg-maple-panel border border-maple-border rounded-xl p-4 md:p-5">
      <button
        type="button" onClick={onReset}
        className="absolute top-3 right-3 md:top-4 md:right-4 text-xs font-semibold text-maple-danger border border-red-500/40 hover:bg-red-500/10 px-3 py-1.5 rounded-md z-10"
        title="선택한 보스(주간·월간)를 모두 해제"
      >
        🔄 초기화
      </button>
      <div className="flex items-center justify-between mb-4 flex-wrap gap-3 pr-20">
        <div>
          <h3 className="font-semibold flex items-center gap-2">
            <span>💎</span> 보스 결정석 수익
          </h3>
          <div className="text-xs text-slate-400 mt-1">
            보스마다 <span className="text-slate-300">난이도 배지를 클릭</span>해 선택하세요. 한 보스는 한 난이도만 선택하며 캐릭터당 주간 12개 제한은 삭제되었습니다. 월드별 판매 한도는 게임에서 별도 확인해 주세요. 표시 수익은 선택한 결정석 전체 합산입니다.
          </div>
        </div>
        <div className="flex items-center gap-3 flex-wrap">
          <div className="text-sm font-medium px-2.5 py-1 rounded-md border bg-maple-bg border-maple-border">
            주간 <span className="text-maple-accent font-bold">{weeklyCount}개</span>
            <span className="text-slate-500"> · 캐릭터 제한 없음</span>
            {/* 월간 카운터는 항상 표시 → 선택해도 레이아웃이 밀리지 않음 */}
            <span className="text-slate-500 ml-2">· 월간 <span className="text-violet-300 font-bold">{monthlyCount}</span></span>
          </div>
          <div className="flex items-center gap-0.5 bg-maple-bg border border-maple-border rounded p-0.5">
            <SortBtn active={sortMode === 'natural'} onClick={() => setSortMode('natural')}>기본</SortBtn>
            <SortBtn active={sortMode === 'price_desc'} onClick={() => setSortMode('price_desc')}>가격 ↓</SortBtn>
            <SortBtn active={sortMode === 'price_asc'} onClick={() => setSortMode('price_asc')}>가격 ↑</SortBtn>
          </div>
        </div>
      </div>

      <div className="divide-y divide-maple-border">
        {sortMode !== 'natural' ? flatEntries.map(({ boss, diff, price, max, monthly }) => {
          const sel = selByBoss[boss.id];
          const active = !!sel && sel.difficulty === diff;
          const revenueInfo = active ? getBossRevenue(boss, sel) : null;
          const members = revenueInfo?.members || 1;
          const revenueVal = revenueInfo?.revenue || 0;
          const st = diffStyle(diff);
          return (
            <div key={boss.id + '_' + diff} className={`flex items-center gap-2 px-1 md:px-2 py-2.5 transition ${active ? 'bg-maple-accent/5' : 'hover:bg-maple-bg/30'}`}>
              <BossIcon id={boss.id} name={boss.name} icon={boss.icon} />
              <span className={`font-medium ${active ? 'text-slate-100' : 'text-slate-300'}`}>{boss.name}</span>
              <button type="button" onClick={() => onToggle(boss.id, diff)}
                title={`${diff} · ${fmtMeso(price)}`}
                className={`flex items-center gap-1.5 rounded-md border px-2.5 py-1 text-xs transition ${
                  active ? `${st.on} font-bold ring-2 ring-white/40 shadow`
                    : `${st.off} hover:brightness-125`}`}>
                <span className="font-bold tracking-wider uppercase">{diff}</span>
                <span className="opacity-90">{fmtMeso(price)}</span>
              </button>
              {monthly && (
                <span className="text-[10px] font-bold tracking-wider px-2 py-0.5 rounded border bg-violet-500/15 text-violet-300 border-violet-500/40">월간</span>
              )}
              {active && (
                <select value={members} onChange={(e) => onSetMembers(boss.id, diff, parseInt(e.target.value) || 1)}
                  className="bg-maple-bg border border-maple-border rounded px-2 py-1 text-xs w-16 text-center"
                  aria-label={`${boss.name} ${diff} 실제 파티원 수`}
                  title={max === 1 ? '솔로 전용 (1인)' : `최대 ${max}인`}>
                  {Array.from({ length: max }, (_, i) => i + 1).map(n => <option key={n} value={n}>{n}인</option>)}
                </select>
              )}
              <span className={`ml-auto text-sm md:text-base ${active ? 'font-bold text-maple-accent' : 'text-slate-500'}`}>{fmtMeso(active ? revenueVal : price)}</span>
            </div>
          );
        }) : bossList.map(({ boss, diffs, monthly }) => {
          const sel = selByBoss[boss.id];
          const checked = !!sel;
          const selEntry = checked ? getDifficultyEntry(boss, sel.difficulty) : null;
          const max = selEntry ? selEntry.max : 6;
          const revenueInfo = checked ? getBossRevenue(boss, sel) : null;
          const members = revenueInfo?.members || 1;
          const revenueVal = revenueInfo?.revenue || 0;

          return (
            <div key={boss.id} className={`px-1 md:px-2 py-3 transition ${checked ? 'bg-maple-accent/5' : 'hover:bg-maple-bg/30'}`}>
              <div className="flex items-center gap-2 mb-2">
                <BossIcon id={boss.id} name={boss.name} icon={boss.icon} />
                <span className={`font-medium ${checked ? 'text-slate-100' : 'text-slate-300'}`}>{boss.name}</span>
                <span className="flex items-center gap-1 text-[11px] text-slate-400" title="이 캐릭터의 보스 1회 소요시간(분)">
                  <span>소요</span>
                  <input type="text" inputMode="numeric" value={bossTimes[boss.id] || ''} placeholder="-"
                    aria-label={`${boss.name} 1회 소요시간(분)`}
                    onChange={(e) => onSetTime(boss.id, parseInt(String(e.target.value).replace(/[^0-9]/g, '')) || 0)}
                    className="w-12 bg-maple-bg border border-maple-border rounded px-1.5 py-0.5 text-xs text-center focus:outline-none focus:border-maple-accent" />
                  <span>분</span>
                </span>
                {monthly && (
                  <span className="text-[10px] font-bold tracking-wider px-2 py-0.5 rounded border bg-violet-500/15 text-violet-300 border-violet-500/40">월간</span>
                )}
                {checked && (
                  <span className="ml-auto font-bold text-maple-accent text-sm md:text-base">{fmtMeso(revenueVal)}</span>
                )}
              </div>
              <div className="flex flex-wrap items-center gap-1.5 pl-1">
                {diffs.map(d => {
                  const active = checked && sel.difficulty === d.diff;
                  const st = diffStyle(d.diff);
                  return (
                    <button
                      key={d.diff}
                      type="button"
                      onClick={() => onToggle(boss.id, d.diff)}
                      title={`${d.diff} · ${fmtMeso(d.price)}`}
                      className={`flex items-center gap-1.5 rounded-md border px-2.5 py-1 text-xs transition ${
                        active
                          ? `${st.on} font-bold ring-2 ring-white/40 shadow`
                          : `${st.off} hover:brightness-125`
                      }`}
                    >
                      <span className="font-bold tracking-wider uppercase">{d.diff}</span>
                      <span className={active ? 'opacity-90' : 'opacity-80'}>{fmtMeso(d.price)}</span>
                    </button>
                  );
                })}
                {checked && (
                  <select
                    value={members}
                    onChange={(e) => onSetMembers(boss.id, sel.difficulty, parseInt(e.target.value) || 1)}
                    className="ml-1 bg-maple-bg border border-maple-border rounded px-2 py-1 text-xs w-16 text-center"
                    aria-label={`${boss.name} ${sel.difficulty} 실제 파티원 수`}
                    title={max === 1 ? '솔로 전용 (1인)' : `최대 ${max}인`}
                  >
                    {Array.from({ length: max }, (_, i) => i + 1).map(n => (
                      <option key={n} value={n}>{n}인</option>
                    ))}
                  </select>
                )}
              </div>
            </div>
          );
        })}
      </div>

      <div className="border-t-2 border-maple-border mt-3 pt-3 space-y-1.5">
        <div className="flex items-center justify-between text-sm">
          <div className="text-slate-300">주간 수익</div>
          <div className="font-semibold text-sky-300">{fmtMeso(revenue.weekly)}</div>
        </div>
        <div className="flex items-center justify-between text-xs">
          <div className="text-slate-400">주간 소요시간</div>
          <div className="font-medium text-sky-200/80">{fmtMinutes(timeSum.weekly)}</div>
        </div>
        <div className="flex items-center justify-between text-sm pt-1">
          <div className="text-slate-300">월간 수익</div>
          <div className="font-semibold text-violet-300">{fmtMeso(revenue.monthly)}</div>
        </div>
        <div className="flex items-center justify-between text-xs">
          <div className="text-slate-400">월간 소요시간 <span className="text-slate-500">(주간×4 + 월간보스)</span></div>
          <div className="font-medium text-violet-200/80">{fmtMinutes(timeSum.monthly)}</div>
        </div>
        <div className="flex items-center justify-between pt-1.5 border-t border-maple-border">
          <div className="font-semibold">주간 + 월간 1회 합계</div>
          <div className="font-bold text-maple-accent text-base md:text-lg">{fmtMeso(revenue.total)}</div>
        </div>
      </div>
    </div>
  );
}

/* =========================================================
 * 보스 결정석 가격 편집기
 * ========================================================= */
function BossDataEditor({ bossData, setBossData }) {
  const updateField = (bossId, diff, field, raw) => {
    const num = parseInt(String(raw).replace(/[^0-9]/g, '')) || 0;
    setBossData(prev => prev.map(b => {
      if (b.id !== bossId) return b;
      const cur = getDifficultyEntry(b, diff);
      const next = { ...cur, [field]: num };
      if (field === 'max') next.max = Math.min(Math.max(1, next.max), 6);
      return {
        ...b,
        difficulties: { ...b.difficulties, [diff]: next }
      };
    }));
  };

  const resetAll = () => {
    if (!confirm('모든 보스/가격/입장 인원을 기본값으로 되돌릴까요?')) return;
    setBossData(JSON.parse(JSON.stringify(DEFAULT_BOSSES)));
  };

  return (
    <div className="max-w-5xl mx-auto space-y-6">
      <div className="flex items-start justify-between flex-wrap gap-3">
        <div>
          <h2 className="text-2xl md:text-3xl font-bold">💎 결정석 가격 관리</h2>
          <p className="text-slate-400 mt-1">보스/난이도별 결정석 가격과 입장 인원을 수정하면 모든 캐릭터에 자동 반영됩니다.</p>
        </div>
        <button
          onClick={resetAll}
          className="text-sm text-maple-danger border border-red-500/30 hover:bg-red-500/10 px-3 py-1.5 rounded"
        >
          기본값으로 초기화
        </button>
      </div>

      <div className="bg-maple-panel border border-maple-border rounded-xl divide-y divide-maple-border">
        {bossData.map(boss => (
          <div key={boss.id} className="p-4 md:p-5">
            <div className="font-semibold mb-3 flex items-center gap-2">
              <BossIcon id={boss.id} name={boss.name} icon={boss.icon} />
              <span>{boss.name}</span>
              {boss.level && <span className="text-xs text-slate-500 font-normal">Lv.{boss.level}</span>}
            </div>
            <div className="space-y-3">
              {Object.entries(boss.difficulties).map(([diff, val]) => {
                const entry = typeof val === 'number' ? { price: val, max: 6 } : { price: val.price || 0, max: val.max || 6 };
                return (
                  <div key={diff} className="grid grid-cols-12 gap-2 items-center">
                    <div className="col-span-3 md:col-span-2 text-sm text-slate-300">{diff}</div>
                    <div className="col-span-6 md:col-span-7">
                      <label className="text-[10px] text-slate-500 block mb-0.5">결정석 가격 (메소)</label>
                      <input
                        type="text"
                        inputMode="numeric"
                        value={entry.price.toLocaleString()}
                        aria-label={`${boss.name} ${diff} 결정석 가격(메소)`}
                        onChange={(e) => updateField(boss.id, diff, 'price', e.target.value)}
                        className="w-full bg-maple-bg border border-maple-border rounded px-2 py-1.5 text-sm text-right focus:outline-none focus:border-maple-accent"
                      />
                    </div>
                    <div className="col-span-3 md:col-span-3">
                      <label className="text-[10px] text-slate-500 block mb-0.5">최대 입장</label>
                      <select
                        value={entry.max}
                        aria-label={`${boss.name} ${diff} 최대 입장 인원`}
                        onChange={(e) => updateField(boss.id, diff, 'max', e.target.value)}
                        className="w-full bg-maple-bg border border-maple-border rounded px-2 py-1.5 text-sm focus:outline-none focus:border-maple-accent"
                      >
                        {[1,2,3,4,5,6].map(n => <option key={n} value={n}>{n}인</option>)}
                      </select>
                    </div>
                  </div>
                );
              })}
            </div>
          </div>
        ))}
      </div>
    </div>
  );
}

/* =========================================================
 * 결정석의 역사 (가격 변동 이력)
 * ========================================================= */
function BossHistoryView() {
  // 시간순(오래된→최신). 화면에는 최신을 위로 표시
  const ordered = PRICE_HISTORY;
  const [selectedId, setSelectedId] = useState(
    ordered.length ? ordered[ordered.length - 1].id : null
  );

  const selIdx = ordered.findIndex(e => e.id === selectedId);
  const entry = ordered[selIdx] || null;
  const prevEntry = selIdx > 0 ? ordered[selIdx - 1] : null; // 직전(더 오래된) 기간

  const curMap = entry ? snapshotPriceMap(entry) : {};
  const prevMap = prevEntry ? snapshotPriceMap(prevEntry) : null;

  return (
    <div className="max-w-5xl mx-auto space-y-6">
      <div>
        <h2 className="text-2xl md:text-3xl font-bold">📜 결정석의 역사</h2>
        <p className="text-slate-400 mt-1">
          결정석 가격이 변동될 때마다 기록됩니다. 기간을 클릭하면 그때의 가격을 볼 수 있어요.
        </p>
      </div>

      {/* 기간 선택 (최신이 위로) */}
      <div className="space-y-2">
        {[...ordered].reverse().map(e => {
          const active = e.id === selectedId;
          const isCurrent = e.id === ordered[ordered.length - 1].id;
          return (
            <button
              key={e.id}
              onClick={() => setSelectedId(e.id)}
              className={`w-full text-left rounded-xl border px-4 py-3 transition ${
                active
                  ? 'bg-maple-accent/15 border-maple-accent/50'
                  : 'bg-maple-panel border-maple-border hover:bg-maple-bg/50'
              }`}
            >
              <div className="flex items-center justify-between gap-3 flex-wrap">
                <div className="flex items-center gap-2">
                  <span className={`font-semibold ${active ? 'text-maple-accent' : 'text-slate-100'}`}>
                    {e.title}
                  </span>
                  {isCurrent && (
                    <span className="text-[10px] font-bold tracking-wider px-2 py-0.5 rounded border bg-emerald-500/15 text-emerald-300 border-emerald-500/40">
                      {e.preview ? '개편 후 계획값' : '현재'}
                    </span>
                  )}
                </div>
                <span className="text-xs text-slate-400">{e.range}</span>
              </div>
            </button>
          );
        })}
      </div>

      {entry && (
        <div className="bg-maple-panel border border-maple-border rounded-xl p-4 md:p-5">
          <div className="mb-3">
            <div className="font-semibold flex items-center gap-2">
              <span>💎</span> {entry.title} <span className="text-xs text-slate-500 font-normal">({entry.range})</span>
            </div>
            {entry.note && <div className="text-xs text-slate-400 mt-1">{entry.note}</div>}
            {prevEntry && (
              <div className="text-xs text-slate-500 mt-1">
                ※ 노란색으로 표시된 항목은 직전 기간(<span className="text-slate-400">{prevEntry.title}</span>) 대비 변동된 가격입니다.
              </div>
            )}
          </div>

          <div className="hidden md:grid grid-cols-12 gap-2 text-xs text-slate-400 px-2 py-2 border-b border-maple-border">
            <div className="col-span-6">보스 / 난이도</div>
            <div className="col-span-6 text-right">결정석 가격</div>
          </div>

          <div className="divide-y divide-maple-border">
            {DEFAULT_BOSSES.filter(boss => priceHistoryBossAvailable(boss, entry)).map(boss => (
              Object.keys(boss.difficulties).map(diff => {
                const price = curMap[boss.id]?.[diff] ?? 0;
                const prevPrice = prevMap ? prevMap[boss.id]?.[diff] : undefined;
                const changed = prevMap && prevPrice !== undefined && prevPrice !== price;
                const down = changed && price < prevPrice;
                return (
                  <div key={`${boss.id}_${diff}`} className="grid grid-cols-12 gap-2 items-center px-2 py-2.5">
                    <div className="col-span-6 flex items-center gap-2 min-w-0">
                      <BossIcon id={boss.id} name={boss.name} icon={boss.icon} />
                      <div className="flex items-center gap-2 flex-wrap min-w-0">
                        <span className="font-medium text-slate-200 truncate">{boss.name}</span>
                        <DifficultyBadge difficulty={diff} />
                        {boss.monthly && (
                          <span className="text-[10px] font-bold tracking-wider px-2 py-0.5 rounded border bg-violet-500/15 text-violet-300 border-violet-500/40">
                            월간
                          </span>
                        )}
                      </div>
                    </div>
                    <div className="col-span-6 text-right">
                      <div className={`font-semibold ${changed ? 'text-maple-warn' : 'text-slate-200'}`}>
                        {fmtMeso(price)}
                      </div>
                      {changed && (
                        <div className="text-[11px] text-slate-500 mt-0.5">
                          이전 {fmtMeso(prevPrice)} <span className={down ? 'text-maple-good' : 'text-maple-danger'}>{down ? '▼' : '▲'}</span>
                          <span className={`ml-1 font-semibold ${down ? 'text-maple-good' : 'text-maple-danger'}`}>
                            ({down ? '-' : '+'}{fmtMeso(Math.abs(price - prevPrice))})
                          </span>
                        </div>
                      )}
                    </div>
                  </div>
                );
              })
            ))}
          </div>
        </div>
      )}
    </div>
  );
}

/* =========================================================
 * 예산 플래너 (장비창 + 목표치 + 예산 우선순위)
 * ========================================================= */
const fmtMesoShort = (n) => {
  if (!n) return '';
  if (n >= 1000000000000) {
    const v = n / 1000000000000;
    return (Number.isInteger(v) ? v : v.toFixed(1).replace(/\.0$/, '')) + '조';
  }
  if (n >= 100000000) {
    const v = n / 100000000;
    return (Number.isInteger(v) ? v : v.toFixed(1).replace(/\.0$/, '')) + '억';
  }
  if (n >= 10000) return Math.round(n / 10000).toLocaleString() + '만';
  return n.toLocaleString();
};

function MesoInput({ value, onChange, placeholder, className, ariaLabel, disabled = false }) {
  const inputClassName = className || 'w-full bg-maple-bg border border-maple-border rounded px-2 py-1.5 text-sm text-right focus:outline-none focus:border-maple-accent';
  return (
    <input
      type="text"
      inputMode="numeric"
      value={value ? Number(value).toLocaleString() : ''}
      placeholder={placeholder || '0'}
      aria-label={ariaLabel}
      disabled={disabled}
      onChange={(e) => onChange(parseNum(e.target.value))}

// 예산 라인 아이템 집계 (장비 + 심볼 + HEXA) — 플래너/요약 공용
function buildBudgetItems(character) {
  const equipment = character.equipment || {};
  const goals = character.goals || emptyGoals();
  const budget = normalizeBudget(character.budget);
  const items = [];
  for (const slot of EQUIP_SLOTS) {
    const e = equipment[slot.id];
    if (e && ((e.cost || 0) > 0 || (e.item && e.item.trim()))) {
      const key = 'eq_' + slot.id;
      items.push({ key, type: 'equip', kindLabel: '장비', slotId: slot.id, name: slot.name,
        label: e.item || '', star: e.star, potential: e.potential, cost: safeBudgetMeso(e.cost, 0),
        saved: safeBudgetMeso(budget.savedByItem[key], 0), priority: e.priority || 0,
        done: !!e.done, editableCost: true });
    }
  }
  const symCost = calcSymbolCost(goals.symbols);
  const symSaved = safeBudgetMeso(budget.savedByItem.symbols, 0);
  if (symCost > 0 || symSaved > 0) items.push({ key: 'symbols', type: 'symbols', kindLabel: '자동 계산', name: '심볼 강화', label: '아케인 · 어센틱 · 그랜드',
    cost: safeBudgetMeso(symCost, 0), saved: symSaved,
    priority: goals.symbols.priority || 0, done: !!goals.symbols.done, editableCost: false });
  const hx = calcHexa(character.hexaSkills, goals.solErda?.fragPrice);
  const hexaSaved = safeBudgetMeso(budget.savedByItem.hexa, 0);
  if (hx.cost > 0 || hexaSaved > 0) items.push({ key: 'hexa', type: 'hexa', kindLabel: '자동 계산', name: 'HEXA 스킬',
    label: `조각 ${hx.frag.toLocaleString()}개 × ${fmtMesoShort(parseNum(goals.solErda?.fragPrice))} · 에르다 ${hx.erda.toLocaleString()}`,
    cost: safeBudgetMeso(hx.cost, 0), saved: hexaSaved,
    priority: character.hexaSkills?.priority || 0, done: !!character.hexaSkills?.done, editableCost: false });
  for (const item of budget.customItems) {
    items.push({
      key: 'custom_' + item.id, type: 'custom', kindLabel: '직접 목표', customId: item.id,
      name: item.name, label: item.memo, cost: item.cost, saved: item.saved,
      priority: item.priority, done: item.done, editableCost: true, deletable: true,
    });
  }
  const pr = (p) => (p && p > 0 ? p : Infinity);
  items.sort((a, b) => pr(a.priority) - pr(b.priority) || b.cost - a.cost);
  return items;
}

function deriveBudgetItem(item) {
  const required = safeBudgetMeso(item?.cost, 0);
  const saved = safeBudgetMeso(item?.saved, 0);
  const done = !!item?.done;
  const completed = done ? required : 0;
  const creditedSaved = done ? 0 : Math.min(saved, required);
  const surplus = done ? 0 : Math.max(0, saved - required);
  const prepared = completed + creditedSaved;
  const remaining = Math.max(0, required - prepared);
  const pct = required > 0 ? Math.min(100, (prepared / required) * 100) : 0;
  const status = required <= 0 ? 'empty' : done ? 'done' : creditedSaved >= required ? 'funded' : creditedSaved > 0 ? 'saving' : 'waiting';
  return { ...item, cost: required, saved, done, required, completed, creditedSaved, surplus, prepared, remaining, pct, status };
}

function budgetSummary(character, weeklyIncome = 0) {
  const items = buildBudgetItems(character).map(deriveBudgetItem);
  const total = items.reduce((sum, item) => sum + item.required, 0);
  const completed = items.reduce((sum, item) => sum + item.completed, 0);
  const saved = items.reduce((sum, item) => sum + item.creditedSaved, 0);
  const surplus = items.reduce((sum, item) => sum + item.surplus, 0);
  const prepared = completed + saved;
  const remaining = Math.max(0, total - prepared);
  const fundingPct = total > 0 ? Math.min(100, (prepared / total) * 100) : 0;
  const completionPct = total > 0 ? Math.min(100, (completed / total) * 100) : 0;
  const actionableItems = items.filter(item => item.required > 0);
  const doneCount = actionableItems.filter(item => item.done).length;
  const weekly = safeBudgetMeso(weeklyIncome, 0);
  const weeks = total <= 0 ? null : remaining === 0 ? 0 : weekly > 0 ? Math.ceil(remaining / weekly) : null;
  return {
    items, total, completed, done: completed, saved, surplus, prepared, remaining,
    pct: fundingPct, fundingPct, completionPct,
    itemCount: actionableItems.length, doneCount,
    moneyReady: total > 0 && remaining === 0,
    allDone: actionableItems.length > 0 && doneCount === actionableItems.length,
    weeks,
  };
}

function BudgetPlanner({ character, totals, setEquipSlot, clearEquipSlot, setGoals, setBudget, setHexa }) {
  const equipment = character.equipment || {};
  const goals = character.goals || emptyGoals();
  const budget = normalizeBudget(character.budget);
  const [editingSlot, setEditingSlot] = useState(null);
  const [prioOpen, setPrioOpen] = useState(true);
  const [dragIndex, setDragIndex] = useState(null);
  const [newCustomId, setNewCustomId] = useState(null);
  const scrollPosRef = useRef(0);

  const getScroller = () => document.querySelector('main');
  const openSlot = (id) => { scrollPosRef.current = getScroller()?.scrollTop || 0; setEditingSlot(id); };
  const closeSlot = () => {
    setEditingSlot(null);
    requestAnimationFrame(() => { const s = getScroller(); if (s) s.scrollTop = scrollPosRef.current; });
  };

  const weeklyIncome = totals.weekly || 0;
  const summary = useMemo(() => budgetSummary(character, weeklyIncome), [character, weeklyIncome]);
  const lineItems = summary.items;
  const totalCost = summary.total;
  const doneCost = summary.completed;
  const savedCost = summary.saved;
  const remaining = summary.remaining;
  const progressPct = summary.fundingPct;
  const weeksToGoal = summary.weeks;
  const monthsToGoal = weeksToGoal ? (weeksToGoal / 4.345).toFixed(1).replace(/\.0$/, '') : null;

  const budgetTotal = budget.total || 0;
  const overBudget = budgetTotal > 0 && totalCost > budgetTotal;

  useEffect(() => {
    if (!newCustomId) return;
    const card = document.querySelector(`[data-budget-item-key="custom_${newCustomId}"]`);
    if (!card) return;
    card.scrollIntoView({ behavior: 'smooth', block: 'center' });
    card.querySelector('[data-budget-name-input]')?.focus();
    setNewCustomId(null);
  }, [lineItems.length, newCustomId]);

  const toggleDone = (item) => {
    if (item.type === 'equip') setEquipSlot(item.slotId, { done: !item.done });
    else if (item.type === 'symbols') setGoals(g => ({ ...g, symbols: { ...g.symbols, done: !g.symbols.done } }));
    else if (item.type === 'hexa') setHexa(h => ({ ...h, done: !h.done }));
    else if (item.type === 'custom') updateCustomItem(item.customId, { done: !item.done });
  };
  const setPriority = (item, n) => {
    if (item.type === 'equip') setEquipSlot(item.slotId, { priority: n });
    else if (item.type === 'symbols') setGoals(g => ({ ...g, symbols: { ...g.symbols, priority: n } }));
    else if (item.type === 'hexa') setHexa(h => ({ ...h, priority: n }));
    else if (item.type === 'custom') updateCustomItem(item.customId, { priority: n });
  };
  function updateCustomItem(id, patch) {
    setBudget(current => ({
      ...current,
      customItems: current.customItems.map(item => item.id === id ? { ...item, ...patch } : item),
    }));
  }
  const setItemCost = (item, cost) => {
    if (item.type === 'equip') setEquipSlot(item.slotId, { cost });
    else if (item.type === 'custom') updateCustomItem(item.customId, { cost });
  };
  const setItemSaved = (item, saved) => {
    const normalizedSaved = Math.min(safeBudgetMeso(saved, 0), item.required);
    if (item.type === 'custom') {
      updateCustomItem(item.customId, { saved: normalizedSaved });
      return;
    }
    setBudget(current => {
      const savedByItem = { ...current.savedByItem };
      if (normalizedSaved > 0) savedByItem[item.key] = normalizedSaved;
      else delete savedByItem[item.key];
      return { ...current, savedByItem };
    });
  };
  const addCustomBudgetItem = () => {
    const id = budgetItemUid();
    setBudget(current => ({
      ...current,
      customItems: [...current.customItems, {
        id, name: '새 목표', cost: 0, saved: 0, done: false,
        priority: lineItems.length + 1, memo: '',
      }],
    }));
    setNewCustomId(id);
    setPrioOpen(true);
  };
  const removeCustomBudgetItem = (item) => {
    if (!confirm(`'${item.name || '이름 없는 목표'}' 예산 목표를 삭제할까요?`)) return;
    setBudget(current => ({
      ...current,
      customItems: current.customItems.filter(candidate => candidate.id !== item.customId),
    }));
  };
  // 예산 우선순위 ▲▼ 이동: 두 항목 위치를 바꾸고 1..N으로 우선순위 재부여
  const move = (idx, dir) => {
    const j = idx + dir;
    if (j < 0 || j >= lineItems.length) return;
    const arr = [...lineItems];
    const tmp = arr[idx]; arr[idx] = arr[j]; arr[j] = tmp;
    arr.forEach((it, i) => setPriority(it, i + 1));
  };
  // 드래그앤드롭: from 위치를 to 위치로 이동
  const reorderTo = (from, to) => {
    if (from == null || to == null || from === to) return;
    const arr = [...lineItems];
    const [m] = arr.splice(from, 1);
    arr.splice(to, 0, m);
    arr.forEach((it, i) => setPriority(it, i + 1));
  };

  const priorityTable = (
    <div className="bg-maple-panel border border-maple-border rounded-xl p-4 md:p-5">
      <div className="flex items-center justify-between gap-3">
        <button type="button" onClick={() => setPrioOpen(o => !o)} className="flex-1 flex items-center justify-between text-left min-w-0">
          <h3 className="font-semibold flex items-center gap-2 min-w-0">
            <span>📋</span>
            <span>예산 목표</span>
            <span className="text-xs text-slate-500 font-normal truncate">({lineItems.length}개 · {fmtMesoShort(totalCost) || '0'})</span>
          </h3>
          <span className="text-slate-400 text-sm flex-shrink-0">{prioOpen ? '▲ 접기' : '▼ 펼치기'}</span>
        </button>
        <button type="button" onClick={addCustomBudgetItem}
          className="min-h-11 flex-shrink-0 rounded-lg border border-maple-accent/50 bg-maple-accent/10 px-3 py-2 text-xs font-bold text-maple-accent hover:bg-maple-accent/20">
          + 직접 목표
        </button>
      </div>
      <p className="text-[11px] text-slate-500 mt-1">각 목표의 필요 메소·현재 모은 메소·실제 완료 여부를 따로 기록합니다.</p>
      {!prioOpen ? null : lineItems.length === 0 ? (
        <div className="text-center py-8 text-slate-500 text-sm space-y-3">
          <p>목표 장비를 선택하거나 직접 예산 목표를 추가해 보세요.</p>
          <button type="button" onClick={addCustomBudgetItem}
            className="min-h-11 rounded-lg bg-maple-accent px-4 py-2 text-sm font-bold text-slate-900 hover:bg-amber-300">
            + 첫 목표 추가
          </button>
        </div>
      ) : (
        <div className="mt-4 space-y-3">
          {lineItems.map((it, idx) => {
            const statusMeta = {
              empty: ['필요 메소 입력', 'bg-slate-700/60 text-slate-300 border-slate-500/40', 'bg-slate-500'],
              waiting: ['대기', 'bg-slate-700/60 text-slate-300 border-slate-500/40', 'bg-slate-500'],
              saving: ['모으는 중', 'bg-amber-500/15 text-amber-300 border-amber-400/40', 'bg-amber-400'],
              funded: ['메소 준비 완료', 'bg-sky-500/15 text-sky-300 border-sky-400/40', 'bg-sky-400'],
              done: ['완료', 'bg-emerald-500/15 text-emerald-300 border-emerald-400/40', 'bg-emerald-400'],
            }[it.status];
            const displayName = it.name || '이름 없는 목표';
            return (
              <article key={it.key}
                data-budget-item-key={it.key}
                onDragOver={(event) => event.preventDefault()}
                onDrop={() => { reorderTo(dragIndex, idx); setDragIndex(null); }}
                className={`rounded-xl border p-3 md:p-4 transition ${it.done ? 'border-emerald-400/35 bg-emerald-500/5' : 'border-maple-border bg-maple-bg/35'} ${dragIndex === idx ? 'ring-1 ring-maple-accent bg-maple-accent/10' : ''}`}>
                <div className="flex items-start gap-3">
                  <div className="flex items-center gap-1 flex-shrink-0 pt-0.5">
                    <span draggable onDragStart={() => setDragIndex(idx)} onDragEnd={() => setDragIndex(null)}
                      className="min-h-9 min-w-9 inline-flex items-center justify-center text-slate-500 cursor-grab select-none" title="드래그해서 순서 변경">⠿</span>
                    <span className="w-5 text-center text-sm font-black text-maple-accent">{idx + 1}</span>
                    <div className="flex flex-col leading-none">
                      <button type="button" aria-label={`${displayName} 우선순위 올리기`} onClick={() => move(idx, -1)} disabled={idx === 0}
                        className="min-w-9 min-h-9 text-slate-300 hover:text-white disabled:opacity-20">▲</button>
                      <button type="button" aria-label={`${displayName} 우선순위 내리기`} onClick={() => move(idx, 1)} disabled={idx === lineItems.length - 1}
                        className="min-w-9 min-h-9 text-slate-300 hover:text-white disabled:opacity-20">▼</button>
                    </div>
                  </div>

                  <div className="min-w-0 flex-1">
                    <div className="flex items-center gap-2 flex-wrap">
                      <span className="rounded-full border border-maple-border bg-maple-bg px-2 py-0.5 text-[10px] font-bold text-slate-400">{it.kindLabel}</span>
                      {it.type === 'custom' ? (
                        <input type="text" value={it.name} placeholder="목표 이름"
                          aria-label={`예산 목표 ${idx + 1} 이름`} data-budget-name-input
                          onChange={(event) => updateCustomItem(it.customId, { name: event.target.value })}

                      ) : (
                        <div className={`font-semibold ${it.done ? 'text-emerald-300' : 'text-slate-100'}`}>
                          {it.name}{it.type === 'equip' && it.star ? <span className="ml-1 text-xs text-amber-300">★{it.star}</span> : null}
                        </div>
                      )}
                    </div>
                    {it.type === 'custom' ? (
                      <input type="text" value={it.label || ''} placeholder="메모 (선택)"

                    <div className="mb-1.5 flex items-center justify-between gap-2">
                      <label className="text-xs font-medium text-slate-300">현재 모은 메소</label>

              ))}

            <div className="flex flex-col gap-1.5 md:gap-2">
              {EQ_COL_RIGHT_OUTER.map(id => (

          {/* PRESETS 바 (표시용) */}

      {/* HEXA 스킬 플래너 (6차) */}
      <HexaPlannerPanel
        hexa={character.hexaSkills || emptyHexa()}

}

function EquipSlotCell({ slot, data, onClick }) {
  const d = normSlot(data);
  const filled = data && ((d.cost || 0) > 0 || (d.item && d.item.trim()));
  const potColor = d.potential && d.potential !== '미설정' ? POTENTIAL_STYLE[d.potential] : '';
  return (
    <button
      onClick={onClick}
      title={slot.name}
      className={`relative w-[60px] h-[60px] md:w-[76px] md:h-[76px] rounded-lg border-2 p-1 flex flex-col items-center justify-center text-center transition overflow-hidden ${
        !filled
          ? 'bg-[#16202f] border-dashed border-slate-600/70 hover:border-maple-accent/60'
          : d.done
            ? 'bg-emerald-500/40 border-emerald-400 hover:border-emerald-300'
            : 'bg-[#1b2536] border-maple-accent/60 hover:border-maple-accent'
      }`}
    >
      {filled ? (
        <>
          <div className={`text-[8px] md:text-[9px] leading-none mb-0.5 ${d.done ? 'text-emerald-100/80' : 'text-slate-500'}`}>{slot.name}</div>
          <div className={`text-[9px] md:text-[10px] font-medium leading-tight line-clamp-2 px-0.5 ${d.done ? 'text-white' : 'text-slate-100'}`}>{d.item || '—'}</div>
          <div className="flex items-center gap-1 mt-0.5">
            {d.star ? <span className="text-[9px] md:text-[10px] text-amber-300 font-bold">★{d.star}</span> : null}
            {d.potTarget ? <span className={`text-[9px] md:text-[10px] font-bold ${d.done ? 'text-white' : (potColor || 'text-lime-300')}`}>{d.potTarget}</span> : null}
          </div>
          {d.cost ? <div className={`text-[8px] md:text-[10px] font-semibold leading-none ${d.done ? 'text-emerald-50' : 'text-emerald-300'}`}>{fmtMesoShort(d.cost)}</div> : null}
          {(d.flameDone || d.jakDone) ? (
            <div className="flex items-center gap-0.5 mt-0.5">
              {d.flameDone ? <span className={`text-[8px] font-bold ${d.done ? 'text-white' : 'text-emerald-400'}`}>추✓</span> : null}
              {d.jakDone ? <span className={`text-[8px] font-bold ${d.done ? 'text-white' : 'text-sky-400'}`}>작✓</span> : null}
            </div>
          ) : null}
          {d.done ? <div className="absolute top-0.5 right-1 text-[10px] text-white font-extrabold drop-shadow">✓</div> : null}
        </>
      ) : (
        <>
          <div className="text-[9px] md:text-[10px] text-slate-500 leading-tight">{slot.name}</div>
          <div className="text-slate-600 text-base leading-none mt-0.5">+</div>
        </>
      )}
    </button>
  );
}

const INPUT_CLS = 'w-full bg-maple-bg border border-maple-border rounded px-3 py-2 text-sm focus:outline-none focus:border-maple-accent';

function TargetSelect({ targets, value, onChange, ariaLabel }) {
  const has = !value || targets.includes(value);
  return (
    <select aria-label={ariaLabel} value={value || ''} onChange={(e) => onChange(e.target.value)} className={INPUT_CLS}>
      <option value="">목표 미설정</option>
      {targets.map(o => <option key={o} value={o}>{o}</option>)}
      {!has && <option value={value}>{value}</option>}
    </select>
  );
}

/* 슬롯 예상 비용 자동계산 — 스타포스 + 잠재/에디의 실제 목표 옵션 확률 */
function SlotAutoCost({ slot, d, cap, onFill, onChange }) {
  const { data: cube, err: cubeError } = useCubeData();
  const partId = SLOT_TO_CUBE_PART[slot.id];
  const [open, setOpen] = useState(false);
  const [level, setLevel] = useState(200);
  const [sfCur, setSfCur] = useState(17);
  const [potCur, setPotCur] = useState('유니크');
  const [addCur, setAddCur] = useState('유니크');
  const potFocus = CUBE_FOCUS_OPTIONS.includes(d.potFocus) ? d.potFocus : 'STR';
  const addFocus = CUBE_FOCUS_OPTIONS.includes(d.addPotFocus) ? d.addPotFocus : 'STR';

  const tgtStar = parseNum(d.star);
  const levelError = level < 1 || level > 300;
  const maxStar = sfMaxStar(level);
  const sfTo = Math.min(tgtStar, maxStar);
  const sfFrom = Math.min(sfCur, sfTo);
  const sfCost = (!levelError && cap.star && sfTo > sfFrom && sfTo > 0)
    ? sfExpect({ level, from: sfFrom, to: sfTo, spare: 0, mvp: 0, pcRoom: false, disc30: false, ev51015: false, boomReduce30: false, restoreDisc20: false, recover: 'spare12', guard: 'auto' }).total : 0;

  const potR = (open && cap.pot && partId && cube && d.potential !== '미설정')
    ? cubeAutoPotentialCost({ cube, method: 'black', partId, level, curGrade: potCur, targetGrade: d.potential, targetPreset: d.potTarget, focus: potFocus }) : null;
  const potCost = potR && potR.ok ? potR.total : 0;
  const addR = (open && cap.addpot && partId && cube && d.addPotential !== '미설정')
    ? cubeAutoPotentialCost({ cube, method: 'addi', partId, level, curGrade: addCur, targetGrade: d.addPotential, targetPreset: d.addPotTarget, focus: addFocus }) : null;
  const addCost = addR && addR.ok ? addR.total : 0;

  const needsCube = !!partId && (
    (cap.pot && d.potential !== '미설정') ||
    (cap.addpot && d.addPotential !== '미설정')
  );
  const cubePending = needsCube && !cube;
  const hasCalcError = !!(levelError || cubePending || (potR && !potR.ok) || (addR && !addR.ok));
  const total = hasCalcError ? 0 : Math.round(sfCost + potCost + addCost);
  const miniSel = 'bg-maple-bg border border-maple-border rounded px-1.5 py-1 text-xs focus:outline-none focus:border-maple-accent';
  const gradesUpTo = POTENTIAL_GRADES.filter(g => g !== '미설정');
  const errorText = (result) => result?.reason === 'downgrade' ? '현재 등급이 더 높음'
    : result?.reason === 'level' ? '장비 레벨 오류'

              <span className="ml-auto text-emerald-300 font-semibold">{sfCost > 0 ? fmtMeso(Math.round(sfCost)) : '-'}</span>

          {cap.pot && d.potential !== '미설정' && (
            <div className="flex items-center gap-2 flex-wrap">
              <span className="text-slate-400 w-16">잠재</span>
              <select aria-label="현재 잠재등급" value={potCur} onChange={(e) => setPotCur(e.target.value)} className={miniSel}>{gradesUpTo.map(g => <option key={g}>{g}</option>)}</select>
              <span>→ <b className="text-amber-300">{d.potential}</b> · {d.potTarget || '등급업만'}</span>
              {cubeGoalNeedsFocus(d.potTarget) && (

              </span>

          {cap.addpot && d.addPotential !== '미설정' && (
            <div className="flex items-center gap-2 flex-wrap">

              <span>→ <b className="text-amber-300">{d.addPotential}</b> · {d.addPotTarget || '등급업만'}</span>

          <div className="flex items-center justify-between pt-2 border-t border-maple-border">

              필요 메소에 채우기

          </div>
          <p className="text-[10px] text-slate-500">스타포스는 12성 복구·스페어 0·최적 파방 기준입니다. 잠재·에디는 선택한 크뎀·쿨감·주스탯 등 실제 옵션 조합 전체의 공식 확률을 합산하며, 에디 유효 줄에는 고정 수치·레벨당 수치도 포함합니다.</p>
        </div>

}

function SlotEditorModal({ slot, data, onChange, onClear, onClose }) {
  const d = normSlot(data);
  const cap = SLOT_CAP[slot.id] || { star: true, pot: true, addpot: true, flame: true, soul: false };
  const targets = getPotTargets(slot.id);
  const dialogRef = useRef(null);
  const closeButtonRef = useRef(null);
  const closeHandlerRef = useRef(onClose);
  closeHandlerRef.current = onClose;

  useEffect(() => {
    const previousFocus = document.activeElement;
    const dialog = dialogRef.current;
    const focusable = () => Array.from(dialog?.querySelectorAll(
      'button:not([disabled]), input:not([disabled]), select:not([disabled]), textarea:not([disabled]), [tabindex]:not([tabindex="-1"])'
    ) || []).filter(element => element.getAttribute('aria-hidden') !== 'true');
    closeButtonRef.current?.focus();
    const handleKeyDown = (event) => {
      if (event.key === 'Escape') {
        event.preventDefault();
        closeHandlerRef.current();
        return;
      }
      if (event.key !== 'Tab') return;
      const items = focusable();
      if (!items.length) {
        event.preventDefault();
        dialog?.focus();
        return;
      }
      const first = items[0], last = items[items.length - 1];
      if (!dialog?.contains(document.activeElement)) {
        event.preventDefault();
        (event.shiftKey ? last : first).focus();
      } else if (event.shiftKey && document.activeElement === first) {
        event.preventDefault();
        last.focus();
      } else if (!event.shiftKey && document.activeElement === last) {
        event.preventDefault();
        first.focus();
      }
    };
    document.addEventListener('keydown', handleKeyDown);
    return () => {
      document.removeEventListener('keydown', handleKeyDown);
      if (previousFocus?.isConnected) previousFocus.focus();
    };
  }, []);

  return (
    <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/60" onClick={onClose}>
      <div
        ref={dialogRef}

            {SLOT_ITEM_PRESETS[slot.id] && (

                  <button key={p} type="button" onClick={() => onChange({ item: p })}

            <input

          <div className="text-[11px] text-slate-500 -mt-1">── 목표 스펙 (이 부위에 적용되는 항목만 표시) ──</div>

          <div className="grid grid-cols-2 gap-3">
            {cap.star && (

          {cap.soul && (

function GoalsPanel({ goals, setGoals }) {
  const lvl = goals.level || { current: '', target: '', percent: '' };

  const lvlPct = lvlTgt > 0 ? Math.min(100, ((lvlCur + lvlPctVal / 100) / lvlTgt) * 100) : 0;
  const hexa = goals.hexa || [false, false, false];

  const setArcane = (id, v) => setGoals(g => ({ ...g, symbols: { ...g.symbols, arcane: { ...g.symbols.arcane, [id]: v } } }));
  const setAuthentic = (id, v) => setGoals(g => ({ ...g, symbols: { ...g.symbols, authentic: { ...g.symbols.authentic, [id]: v } } }));
  const setGrand = (id, v) => setGoals(g => ({ ...g, symbols: { ...g.symbols, grand: { ...(g.symbols.grand || {}), [id]: v } } }));
  const toggleHexa = (i) => setGoals(g => { const h = [...(g.hexa || [false, false, false])]; h[i] = !h[i]; return { ...g, hexa: h }; });
  const symbolCost = calcSymbolCost(goals.symbols);

  return (
    <div className="bg-maple-panel border border-maple-border rounded-xl p-4 md:p-5 space-y-6">

          <div className="relative">
            <input type="number" min="0" max="100" value={lvl.percent} placeholder="경험치"
              onChange={(e) => setGoals(g => ({ ...g, level: { ...g.level, percent: Math.min(100, Math.max(0, parseNum(e.target.value))) } }))}
              className="w-20 bg-maple-bg border border-maple-border rounded px-3 py-2 text-sm text-center focus:outline-none focus:border-maple-accent" />
            <span className="absolute right-2 top-1/2 -translate-y-1/2 text-xs text-slate-500">%</span>
          </div>
          <span className="text-slate-500">→</span>
          <input type="number" min="1" max="300" value={lvl.target} placeholder="목표"
            onChange={(e) => setGoals(g => ({ ...g, level: { ...g.level, target: parseNum(e.target.value) } }))}
            className="w-20 bg-maple-bg border border-maple-border rounded px-3 py-2 text-sm text-center focus:outline-none focus:border-maple-accent" />
          <div className="flex-1 min-w-[80px]"><ProgressBar value={lvlPct} tone="bg-amber-400" /></div>

        <div className="grid md:grid-cols-2 gap-x-6 gap-y-2">

/* =========================================================
 * 심볼 가격 (레벨별 강화비용 기록)
 * ========================================================= */
function SymbolCostTable({ title, accent, regions, table, maxLevel }) {
  const levels = [];
  for (let L = 2; L <= maxLevel; L++) levels.push(L);
  return (
    <div className="bg-maple-panel border border-maple-border rounded-xl p-4 md:p-5">
      <h3 className={`font-semibold mb-3 ${accent}`}>{title}</h3>
      <div className="overflow-x-auto">
        <table className="w-full text-[11px] md:text-xs border-collapse min-w-[640px]">
          <thead>
            <tr className="text-slate-400 border-b border-maple-border">
              <th className="text-left py-1.5 px-2 sticky left-0 bg-maple-panel">도달</th>
              {regions.map(r => <th key={r.id} className="text-right py-1.5 px-2 whitespace-nowrap">{r.name}</th>)}
            </tr>
          </thead>
          <tbody>
            {levels.map(L => (
              <tr key={L} className="border-b border-maple-border/40">
                <td className="py-1 px-2 text-slate-300 sticky left-0 bg-maple-panel">{L}렙</td>
                {regions.map(r => {
                  const arr = table[r.id] || [];
                  const step = (arr[L] || 0) - (arr[L - 1] || 0);
                  return <td key={r.id} className="text-right py-1 px-2 text-slate-200 tabular-nums">{step.toLocaleString()}</td>;
                })}
              </tr>
            ))}
            <tr className="border-t-2 border-maple-border font-bold">
              <td className="py-1.5 px-2 text-maple-accent sticky left-0 bg-maple-panel">합계</td>
              {regions.map(r => {
                const arr = table[r.id] || [];
                return <td key={r.id} className="text-right py-1.5 px-2 text-emerald-300 tabular-nums">{(arr[maxLevel] || 0).toLocaleString()}</td>;
              })}
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  );
}

/* =========================================================

function BudgetSummaryView({ characters, charTotals, onSelect }) {

    remaining: a.remaining + x.s.remaining,
    itemCount: a.itemCount + x.s.itemCount,
    doneCount: a.doneCount + x.s.doneCount,

              <div><div className="text-xs text-slate-400">완료 금액</div><div className="text-base md:text-xl font-bold text-emerald-300 break-all">{fmtMeso(grand.completed)}</div></div>
              <div><div className="text-xs text-slate-400">목표에 반영된 모은 메소</div><div className="text-base md:text-xl font-bold text-sky-300 break-all">{fmtMeso(grand.saved)}</div></div>

                </div>
            ))}
          </div>
        </>
      )}
    </div>
  );

  const presetActive = (flags) => SF_EVENT_KEYS.every(key => c[key] === !!flags[key]);

        <div className="mt-4 grid gap-4">
          <section className="bg-maple-bg/35 border border-maple-border rounded-lg overflow-hidden">
            <div className="px-4 py-3 border-b border-maple-border">
              <h4 className="text-sm font-semibold">파괴 복구 방식 가성비</h4>
              <p className="text-[11px] text-slate-500 mt-0.5">현재 목표 성급·파괴방지·할인·이벤트 조건 기준입니다.</p>
            </div>
            <div className="overflow-x-auto">
              <table className="w-full min-w-[680px] text-xs">
                <thead className="bg-slate-900/35 text-slate-400">
                  <tr><th className="text-left px-3 py-2">복구 방식</th><th className="text-right px-3 py-2">총 기대가치</th><th className="text-right px-3 py-2">순수 메소</th><th className="text-right px-3 py-2">기대 스페어</th><th className="text-right px-3 py-2">최저 대비</th></tr>
                </thead>
                <tbody className="divide-y divide-maple-border/70">
                  {recoveryRows.map(row => (
                    <tr key={row.id} className={displayedRecover === row.id ? 'bg-amber-400/5' : ''}>
                      <td className="px-3 py-2.5 font-medium text-slate-200">
                        {row.label}
                        {displayedRecover === row.id && <span className="ml-1.5 text-[10px] text-sky-300">현재 선택</span>}
                        {row.best && <span className="ml-1.5 rounded bg-emerald-400/15 px-1.5 py-0.5 text-[10px] text-emerald-300">가성비</span>}
                      </td>
                      <td className="px-3 py-2.5 text-right font-semibold text-amber-300">{fmtMeso(Math.round(row.result.total))}</td>
                      <td className="px-3 py-2.5 text-right text-emerald-300">{fmtMeso(Math.round(row.result.meso))}</td>
                      <td className="px-3 py-2.5 text-right text-slate-300">{num(row.result.equips)}개</td>
                      <td className="px-3 py-2.5 text-right text-slate-300">{row.best ? '최저' : `+${fmtMeso(Math.round(row.difference))}`}</td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
            {!hasRestore && <p className="px-4 py-2.5 border-t border-maple-border text-[11px] text-slate-500">흔적 복구 비교는 복구 비용표가 있는 140·160·200·250제 장비에서 지원합니다.</p>}
          </section>

          <section className="bg-maple-bg/35 border border-maple-border rounded-lg overflow-hidden">
            <div className="px-4 py-3 border-b border-maple-border">
              <h4 className="text-sm font-semibold">파괴방지 성급별 손익 비교</h4>
              <p className="text-[11px] text-slate-500 mt-0.5">복구 방식도 성급별 자동 최저·현재 이벤트 기준입니다. 손익분기는 스페어가 해당 가격 이상일 때 파괴방지가 유리해지는 지점입니다.</p>
            </div>
            {safeguardRows.length ? (
              <div className="overflow-x-auto">
                <table className="w-full min-w-[820px] text-xs">
                  <thead className="bg-slate-900/35 text-slate-400">
                    <tr><th className="text-left px-3 py-2">강화 구간</th><th className="text-right px-3 py-2">파괴방지 미사용</th><th className="text-right px-3 py-2">파괴방지 사용</th><th className="text-left px-3 py-2">현재 가성비</th><th className="text-right px-3 py-2">기대비용 차이</th><th className="text-right px-3 py-2">스페어 손익분기</th></tr>
                  </thead>
                  <tbody className="divide-y divide-maple-border/70">
                    {safeguardRows.map(row => {
                      const roundedThreshold = Number.isFinite(row.threshold) ? Math.ceil(row.threshold / 10000) * 10000 : row.threshold;
                      const tied = !row.eventSafe && row.difference < 0.5;
                      return (
                        <tr key={row.star}>
                          <td className="px-3 py-2.5 font-semibold text-slate-200">{row.star} → {row.star + 1}성</td>
                          <td className="px-3 py-2.5 text-right text-slate-300">{fmtMeso(Math.round(row.noGuardCost))}</td>
                          <td className="px-3 py-2.5 text-right text-slate-300">{row.eventSafe ? '불필요' : fmtMeso(Math.round(row.guardCost))}</td>
                          <td className="px-3 py-2.5">
                            <span className={`font-semibold ${row.eventSafe || !row.recommendGuard ? 'text-emerald-300' : 'text-amber-300'}`}>
                              {row.eventSafe ? '100% 성공 이벤트' : tied ? '동일' : row.recommendGuard ? '파괴방지' : '미사용'}
                            </span>
                          </td>
                          <td className="px-3 py-2.5 text-right text-slate-300">{row.eventSafe || tied ? '-' : `${fmtMeso(Math.round(row.difference))} 절약`}</td>
                          <td className="px-3 py-2.5 text-right font-medium text-sky-300">{row.eventSafe ? '해당 없음' : Number.isFinite(roundedThreshold) ? `약 ${fmtMeso(roundedThreshold)} 이상` : '손익분기 없음'}</td>
                        </tr>
                      );
                    })}
                  </tbody>
                </table>
              </div>
            ) : (
              <p className="px-4 py-4 text-xs text-slate-500">이 장비는 15~17성 파괴방지 구간을 지원하지 않습니다.</p>
            )}
          </section>
        </div>
      )}
    </div>
  );
}

function PotentialCalc() {
  const { data: cube, err: cubeErr } = useCubeData();
  const [c, setC] = useState({ method: 'black', partId: 1, level: 200, curGrade: '유니크' });
  const set = (k, v) => setC(p => ({ ...p, [k]: v }));
  const [fails, setFails] = useState({ r2e: 0, e2u: 0 });
  const [picks, setPicks] = useState(['any', 'any', 'any']);
  const [targetMode, setTargetMode] = useState('exact-unordered');
  const [categoryPicks, setCategoryPicks] = useState(['attack_pct', 'boss_pct', 'ied_pct']);
  const pickCtxRef = useRef(null); // picks가 속한 문맥 키

  // 현재 문맥의 줄별 옵션 목록 (확률 내림차순)
  const lineOpts = useMemo(() => {
    if (!cube) return null;
    const rows = cubeLineRows(cube, c.method, '레전드리', c.partId, c.level);
    return rows ? { missing: false, lines: rows } : { missing: true, lines: [] };
  }, [cube, c.method, c.partId, c.level]);

  const pickDefault = (rows, li) => cubePickStrong(rows, li);
  // 옵션 문맥(줄 분포)이 실제로 바뀌면 새 문맥의 기본 선택을 즉시 계산하고 상태도 동기화한다.
  // 같은 버킷 내 레벨 편집은 ctxKey가 그대로라 선택을 유지한다.
  const ctxKey = cubeContextKey(c.method, '레전드리', c.partId, c.level);
  const contextChanged = !!(lineOpts && !lineOpts.missing && pickCtxRef.current !== ctxKey);
  const effPicks = contextChanged
    ? lineOpts.lines.map((rows, li) => pickDefault(rows, li))
    : picks;
  useEffect(() => {
    if (!contextChanged) return;
    pickCtxRef.current = ctxKey;
    setPicks(effPicks);
  }, [contextChanged, ctxKey, effPicks]);

  const partName = cube ? (cube.parts.find(p => p[1] === c.partId) || ['', c.partId])[0] : '';
  const mergedOptionRows = useMemo(
    () => cubeMergedChoiceRows(lineOpts && !lineOpts.missing ? lineOpts.lines : []),
    [lineOpts],
  );
  const orderedPicks = useMemo(() => effPicks.map((pick, lineIndex) => {
    if (pick === 'any' || !cube || !lineOpts || lineOpts.missing) return pick;
    const rows = lineOpts.lines[lineIndex] || [];
    if (rows.some(row => row.idx === pick)) return pick;
    const wantedText = cube.options[pick]?.[0];
    return rows.find(row => row.text === wantedText)?.idx ?? pick;
  }), [cube, lineOpts, effPicks]);
  const roll = useMemo(() => {
    if (!cube || !lineOpts || lineOpts.missing) return null;
    if (targetMode === 'ordered') {
      return cubeExactRoll(cube, c.method, '레전드리', c.partId, c.level, orderedPicks);
    }
    if (targetMode === 'exact-unordered') {
      const goal = cubeUnorderedProbability(
        cube,
        c.method,
        '레전드리',
        c.partId,
        c.level,
        effPicks,
        (target, row) => cube.options[target]?.[0] === row.text,
      );
      return { ...goal, lines: [], complete: true };
    }
    const goal = cubeUnorderedProbability(
      cube,
      c.method,
      '레전드리',
      c.partId,
      c.level,
      categoryPicks,
      (target, row) => !!CUBE_CATEGORY_BY_ID[target]?.test(row.text),
    );
    return { ...goal, lines: [], complete: true };
  }, [cube, lineOpts, c.method, c.partId, c.level, targetMode, orderedPicks, effPicks, categoryPicks]);
  const gup = cubeGradeUp({ method: c.method, level: c.level, curGrade: c.curGrade, fails });
  const u2lStep = gup.rows.find(st => st.from === '유니크' && st.to === '레전드리');
  const gi = (g) => GRADES.indexOf(g);
  const upgrading = gi(c.curGrade) < gi('레전드리');
  const costL = cubeMesoCost(gup.way, c.level, '레전드리');
  const H4 = roll ? roll.perRoll : 0;
  const targetTries = H4 > 0 ? (upgrading ? (1 - H4) / H4 : 1 / H4) : 0;
  const totalTries = gup.tries + targetTries;
  const totalMeso = gup.meso + targetTries * costL;
  const q = (v) => H4 <= 0 ? null : H4 >= 1 ? 1 : Math.ceil(Math.log(1 - v) / Math.log(1 - H4));
  const levelErr = c.level < 1 || c.level > 300;

  const setPick = (li, v) => setPicks(p => { const n = [...p]; n[li] = v === 'any' ? 'any' : Number(v); return n; });
  const setCategoryPick = (li, v) => setCategoryPicks(p => { const n = [...p]; n[li] = v; return n; });
  const LINE_LABEL = ['1번째 줄', '2번째 줄', '3번째 줄'];
  const TARGET_LABEL = ['목표 A', '목표 B', '목표 C'];
  const modeLabel = CUBE_TARGET_MODES.find(([id]) => id === targetMode)?.[1] || '';
  const fmtPct = (p) => (p * 100 < 0.01 && p > 0) ? (p * 100).toFixed(6) + '%' : (p * 100).toFixed(4) + '%';

  return (
    <div className="bg-maple-panel border border-maple-border rounded-xl p-4 md:p-5 space-y-5">
      <div>
        <h3 className="font-semibold mb-1 flex items-center gap-2"><span>🎲</span> 잠재 정밀 기대비용</h3>
        <p className="text-xs text-slate-400 mb-3">KMS 공식 확률 · 부위·레벨별 줄 옵션 직접 선택 · 순차 제한 재정규화 · 천장 반영 · 등급업+목표옵션 통합</p>

        <div className="grid grid-cols-2 md:grid-cols-5 gap-3">
          <CalcField label="잠재 종류">
            <select value={c.method} onChange={(e) => set('method', e.target.value)} className={SEL_CLS + ' w-full'}>
              <option value="black">일반/블랙 (메소)</option><option value="addi">에디셔널 (메소)</option>
            </select>
          </CalcField>
          <CalcField label="장비 부위">
            <select value={c.partId} onChange={(e) => set('partId', Number(e.target.value))} className={SEL_CLS + ' w-full'} disabled={!cube}>
              {cube ? cube.parts.map(([nm, id]) => <option key={id} value={id}>{nm}</option>) : <option value={c.partId}>로딩…</option>}
            </select>
          </CalcField>
          <CalcField label="장비 레벨"><input type="number" value={c.level} onChange={(e) => set('level', parseNum(e.target.value))} className={SEL_CLS + ' w-full'} /></CalcField>
          <CalcField label="현재 등급">
            <select value={c.curGrade} onChange={(e) => set('curGrade', e.target.value)} className={SEL_CLS + ' w-full'}>{GRADES.map(x => <option key={x}>{x}</option>)}</select>
          </CalcField>
          <CalcField label="목표 등급"><div className="bg-maple-bg/60 border border-maple-border rounded px-2 py-1.5 text-sm text-amber-300 font-semibold">레전드리</div></CalcField>
        </div>

        {upgrading && !levelErr && (
          <div className="grid grid-cols-3 gap-3 mt-3">
            {gi(c.curGrade) <= 0 && <CalcField label="레어→에픽 연속 실패"><input type="number" value={fails.r2e} onChange={(e) => setFails(f => ({ ...f, r2e: parseNum(e.target.value) }))} className={SEL_CLS + ' w-full'} /></CalcField>}
            {gi(c.curGrade) <= 1 && <CalcField label="에픽→유니크 연속 실패"><input type="number" value={fails.e2u} onChange={(e) => setFails(f => ({ ...f, e2u: parseNum(e.target.value) }))} className={SEL_CLS + ' w-full'} /></CalcField>}
            {u2lStep && <CalcField label="유니크→레전드리 천장 가격"><div className="bg-maple-bg/60 border border-maple-border rounded px-2 py-1.5 text-sm text-amber-300 font-semibold">{fmtMeso(u2lStep.ceilingMeso)}</div></CalcField>}
          </div>
        )}
      </div>

      {cubeErr ? (
        <div className="bg-red-500/10 border border-red-500/40 text-red-200 text-xs rounded px-3 py-2">⚠️ 옵션 확률 데이터를 불러오지 못했습니다. 네트워크 확인 후 새로고침하세요.</div>
      ) : !cube ? (
        <div className="text-slate-400 text-sm py-4 text-center">공식 옵션 확률 데이터 로딩 중…</div>
      ) : levelErr ? (
        <div className="bg-amber-500/10 border border-amber-500/40 text-amber-200 text-xs rounded px-3 py-2">⚠️ 장비 레벨은 1~300 범위로 입력하세요. (현재 {c.level || 0})</div>
      ) : lineOpts.missing ? (
        <div className="bg-amber-500/10 border border-amber-500/40 text-amber-200 text-xs rounded px-3 py-2">이 부위·레벨 조합의 공식 옵션 문맥이 없습니다. (레벨 1~300, 지원 부위 확인)</div>
      ) : (
        <>
          {/* 목표 옵션 3줄 선택 */}
          <div className="border-t border-maple-border pt-4">
            <div className="flex items-center justify-between gap-3 mb-3 flex-wrap">
              <div className="flex items-center gap-2"><span>🎯</span><h4 className="font-semibold text-sm">목표 옵션 (레전드리 3줄)</h4></div>
              <div className="flex gap-1 bg-maple-bg/60 border border-maple-border rounded-lg p-1" role="group" aria-label="잠재 목표 계산 방식">
                {CUBE_TARGET_MODES.map(([id, label]) => (
                  <button
                    key={id}
                    type="button"
                    onClick={() => setTargetMode(id)}
                    className={`text-[11px] px-2.5 py-1.5 rounded-md transition ${targetMode === id ? 'bg-maple-accent text-white font-semibold' : 'text-slate-400 hover:text-slate-200 hover:bg-white/5'}`}
                    aria-pressed={targetMode === id}
                  >
                    {label}
                  </button>
                ))}
              </div>
            </div>
            <div className="space-y-2">
              {[0, 1, 2].map(li => {
                const ordered = targetMode === 'ordered';
                const category = targetMode === 'category-unordered';
                const rows = ordered ? (lineOpts.lines[li] || []) : mergedOptionRows;
                const cur = category ? categoryPicks[li] : ordered ? orderedPicks[li] : effPicks[li];
                const unavailable = ordered && cur !== 'any' && !rows.some(row => row.idx === cur);
                const displayedOption = !ordered && !category && cur !== 'any'
                  ? (mergedOptionRows.find(row => row.text === cube.options[cur]?.[0])?.idx ?? cur)
                  : unavailable ? '__unavailable__' : cur;
                const info = ordered && roll && roll.lines[li];
                return (
                  <div key={li} className="grid grid-cols-12 gap-2 items-center">
                    <span className="col-span-3 md:col-span-2 text-xs text-slate-400">{ordered ? LINE_LABEL[li] : TARGET_LABEL[li]}</span>
                    {category ? (
                      <select value={cur} onChange={(e) => setCategoryPick(li, e.target.value)}
                        className={SEL_CLS + ' col-span-6 md:col-span-7 w-full text-xs'}>
                        <option value="any">— 아무거나 (무시) —</option>
                        {CUBE_CATEGORY_OPTIONS.map(([id, label]) => <option key={id} value={id}>{label} · 수치 무관</option>)}
                      </select>
                    ) : (
                      <select value={displayedOption === 'any' ? 'any' : String(displayedOption)} onChange={(e) => setPick(li, e.target.value)}
                        className={SEL_CLS + ' col-span-6 md:col-span-7 w-full text-xs'}>
                        <option value="any">— 아무거나 (무시) —</option>
                        {unavailable && <option value="__unavailable__" disabled>{cube.options[cur]?.[0] || '선택 옵션'} · 이 줄에 등장하지 않음</option>}
                        {rows.map(r => (
                          <option key={`${r.idx}-${r.text}`} value={r.idx}>
                            {r.text}{ordered ? ` (${fmtPct(r.prob)})` : ''}
                          </option>
                        ))}
                      </select>
                    )}
                    <span className="col-span-3 text-right text-xs">
                      {cur === 'any' ? <span className="text-slate-500">100%</span>
                        : !ordered ? <span className="text-sky-300">전체 순열 합산</span>
                        : info && info.p == null ? <span className="text-slate-400">전체 경우 합산</span>
                        : info && info.p > 0 ? <span className="text-emerald-300 font-semibold">{fmtPct(info.p)}</span>
                        : <span className="text-red-300">제약상 불가</span>}
                    </span>
                  </div>
                );
              })}
            </div>
            <p className="text-[10px] text-slate-500 mt-2">
              {targetMode === 'ordered'
                ? '선택한 옵션이 지정한 줄 위치에 정확히 등장할 확률입니다.'
                : targetMode === 'exact-unordered'
                  ? '같은 문구의 정확한 옵션 3개가 어느 줄에든 등장하는 모든 순열을 합산합니다.'
                  : '선택한 종류의 옵션이 수치와 줄 위치에 관계없이 각각 한 줄씩 등장하는 경우를 합산합니다.'}
            </p>
            {targetMode === 'ordered' && roll && roll.lines.some(l => l.excl > 0) && (
              <p className="text-[10px] text-slate-500 mt-1.5">※ 앞줄 제한(쓸만한 스킬·피격 옵션)으로 뒷줄 확률이 공식 재정규화되었습니다.</p>
            )}
          </div>

          {/* 결과 */}
          <div className="bg-maple-bg/50 border border-maple-border rounded-lg px-4 py-3">
            <div className="text-xs text-slate-500 mb-1">{partName} · Lv.{c.level} · {c.method === 'black' ? '일반/블랙' : '에디셔널'} · {c.curGrade} → 레전드리 · {modeLabel}</div>

            {gup.rows.length > 0 && (
              <div className="mb-2">
                {gup.rows.map(st => (
                  <div key={st.from} className="flex items-center justify-between text-[11px] py-0.5 text-slate-400">
                    <span>등급업 {st.from} → {st.to}</span>
                    <span>기대 {st.tries.toFixed(1)}회 · {fmtMeso(Math.round(st.meso))}</span>
                  </div>
                ))}
              </div>
            )}

            <ResultRow label="1회 목표 성공확률" value={H4 > 0 ? fmtPct(H4) : '0% (불가)'} />
            <ResultRow label="목표 옵션 기대 재설정" value={H4 > 0 ? Math.round(1 / H4).toLocaleString() + '회' : '-'} />
            {gup.rows.length > 0 && <ResultRow label="등급업 기대 메소" value={fmtMeso(Math.round(gup.meso))} />}
            <div className="border-t border-maple-border mt-1.5 pt-1.5">
              <ResultRow label="총 기대 유료 재설정 (통합)" value={H4 > 0 ? Math.round(totalTries).toLocaleString() + '회' : '-'} />
              <ResultRow label="총 기대 메소 (통합)" value={H4 > 0 ? fmtMeso(Math.round(totalMeso)) : '목표 도달 불가'} strong />
            </div>
            {upgrading && gup.rows.length > 0 && (
              <p className="text-[10px] text-slate-500 mt-1">※ 등급업 성공 롤이 레전드리 3줄을 생성하므로 목표옵션 1회를 중복 가산하지 않습니다.</p>
            )}

            {H4 > 0 && H4 < 1 && (
              <div className="mt-2 pt-2 border-t border-dashed border-maple-border grid grid-cols-4 gap-1 text-center">

const sundayDateMs = (dateText) => {
  const [year, month, day] = dateText.split('-').map(Number);
  return Date.UTC(year, month - 1, day);
};
const sundayAddDays = (dateText, days) =>
  new Date(sundayDateMs(dateText) + days * 86400000).toISOString().slice(0, 10);
const sundayWeeksBetween = (later, earlier) =>
  Math.max(0, Math.round((sundayDateMs(later) - sundayDateMs(earlier)) / SUNDAY_WEEK_MS));
const sundayTodayKst = () => new Date(Date.now() + 9 * 60 * 60 * 1000).toISOString().slice(0, 10);
const sundayNextCalendarDate = (dateText) => {
  const current = new Date(sundayDateMs(dateText));
  const add = ((7 - current.getUTCDay()) % 7) || 7;
  return sundayAddDays(dateText, add);
};
const sundayCurrentOrNextCalendarDate = (dateText) => {
  const current = new Date(sundayDateMs(dateText));
  const add = (7 - current.getUTCDay()) % 7;
  return sundayAddDays(dateText, add);
};
const sundayWeekOfYear = (dateText) => {
  const [year] = dateText.split('-').map(Number);
  return Math.floor((sundayDateMs(dateText) - Date.UTC(year, 0, 1)) / SUNDAY_WEEK_MS) + 1;
};
const sundayMedian = (values) => {
  if (!values.length) return null;
  const sorted = [...values].sort((a, b) => a - b);
  const middle = Math.floor(sorted.length / 2);
  return sorted.length % 2 ? sorted[middle] : (sorted[middle - 1] + sorted[middle]) / 2;
};
const sundayWeightedQuantile = (values, weights, quantile) => {
  if (!values.length || values.length !== weights.length) return null;
  const rows = values
    .map((value, index) => ({ value, weight: Math.max(0, weights[index] || 0) }))
    .sort((a, b) => a.value - b.value);
  const total = rows.reduce((sum, row) => sum + row.weight, 0);
  if (!(total > 0)) return rows[Math.floor((rows.length - 1) * quantile)].value;
  const threshold = Math.max(0, Math.min(1, quantile)) * total;
  let cumulative = 0;
  for (const row of rows) {
    cumulative += row.weight;
    if (cumulative >= threshold) return row.value;
  }
  return rows[rows.length - 1].value;
};
const sundayNormalizeScores = (values) => {
  const safe = values.map(value => Number.isFinite(value) && value > 0 ? value : 0);
  const total = safe.reduce((sum, value) => sum + value, 0);
  if (!(total > 0)) return safe.map(() => 1 / Math.max(1, safe.length));
  return safe.map(value => value / total);
};
const sundayCircularWeekDistance = (left, right) => {
  const direct = Math.abs(left - right) % 52;
  return Math.min(direct, 52 - direct);
};
const sundayRankForecasts = (items, scoreKey = 'probability') =>
  [...items].sort((a, b) => {
    const scoreDiff = (b[scoreKey] || 0) - (a[scoreKey] || 0);
    if (Math.abs(scoreDiff) > 1e-15) return scoreDiff;
    if (a.benefit < b.benefit) return -1;
    if (a.benefit > b.benefit) return 1;
    return 0;
  });
function sundayForecastStartDate(records, today) {
  const calendarStart = sundayCurrentOrNextCalendarDate(today);
  const latestSunday = (records || [])
    .filter(record => record.kind === 'sunday')
    .reduce((latest, record) => !latest || record.date > latest ? record.date : latest, null);
  if (!latestSunday) return calendarStart;
  const afterLatestRecord = sundayAddDays(latestSunday, 7);
  return afterLatestRecord > calendarStart ? afterLatestRecord : calendarStart;
}
const sundayGapBucket = (gap) =>
  gap <= 2 ? 0 : gap <= 4 ? 1 : gap <= 8 ? 2 : gap <= 13 ? 3 : gap <= 26 ? 4 : 5;
const sundayMix = (prior, strength, successes, total) =>
  (strength * prior + successes) / (strength + total);
const _sundayPreparedCache = new WeakMap();
const sundayPrepareHistory = (records) => {
  const source = Array.isArray(records) ? records : [];
  if (_sundayPreparedCache.has(source)) return _sundayPreparedCache.get(source);
  const rows = source
    .filter(record => record.kind === 'sunday')
    .sort((a, b) => a.date.localeCompare(b.date))
    .map(record => ({
      date: record.date,
      dateMs: sundayDateMs(record.date),
      week: sundayWeekOfYear(record.date),
      season: Math.floor((Number(record.date.slice(5, 7)) - 1) / 3),
      benefits: new Set(record.benefits || []),
    }));

  _sundayPreparedCache.set(source, prepared);
  return prepared;
};

function sundayForecastBenefit(records, benefit, targetDate, halfLife = 78) {
  const prepared = sundayPrepareHistory(records);
  const hitRows = [];
  let weekCount = 0, recentCount = 0, recentWeeks = 0;
  let lastObservedDateMs = null;
  let recentWeight = 0, recentHits = 0, recentWeightSquare = 0;
  let calendarWeight = 0, calendarHits = 0;
  const targetMs = sundayDateMs(targetDate);
  const targetWeek = sundayWeekOfYear(targetDate);
  const targetMonth = Number(targetDate.slice(5, 7));
  const targetSeason = Math.floor((targetMonth - 1) / 3);
  for (const record of prepared.rows) {
    if (record.date >= targetDate) break;
    weekCount += 1;
    lastObservedDateMs = record.dateMs;
    const age = Math.max(0, Math.round((targetMs - record.dateMs) / SUNDAY_WEEK_MS));
    const weight = Math.pow(2, -age / halfLife);
    const hit = record.benefits.has(benefit) ? 1 : 0;
    if (hit) hitRows.push(record);
    if (age <= 52) {
      recentWeeks += 1;
      recentCount += hit;
    }
    recentWeight += weight;
    recentWeightSquare += weight * weight;
    recentHits += weight * hit;

    const directDistance = Math.abs(targetWeek - record.week);
    const weekDistance = Math.min(directDistance, 52 - Math.min(52, directDistance));
    const weekKernel = Math.exp(-0.5 * Math.pow(weekDistance / 3, 2));
    const seasonSimilarity = record.season === targetSeason ? 1 : 0.15;
    const similarity = 0.5 * seasonSimilarity + 0.5 * weekKernel;
    const calendar = weight * similarity;
    calendarWeight += calendar;
    calendarHits += calendar * hit;
  }
  const pFrequency = (hitRows.length + 0.5) / (weekCount + 1);
  const pRecent = sundayMix(pFrequency, 4, recentHits, recentWeight);
  const pCalendar = sundayMix(pRecent, 12, calendarHits, calendarWeight);

  const continuousHits = hitRows.filter(record => record.date >= SUNDAY_CONTINUOUS_START);
  const gapValues = [];
  const exposure = Array(6).fill(0);
  const success = Array(6).fill(0);
  for (let index = 1; index < continuousHits.length; index++) {
    const gap = Math.max(0, Math.round(
      (continuousHits[index].dateMs - continuousHits[index - 1].dateMs) / SUNDAY_WEEK_MS
    ));
    if (!(gap > 0)) continue;
    gapValues.push(gap);
    for (let atRisk = 1; atRisk <= gap; atRisk++) {
      const bucket = sundayGapBucket(atRisk);
      exposure[bucket] += 1;
      if (atRisk === gap) success[bucket] += 1;

  }
  const lastDate = hitRows.length ? hitRows[hitRows.length - 1].date : null;
  const currentGap = hitRows.length
    ? Math.max(0, Math.round((targetMs - hitRows[hitRows.length - 1].dateMs) / SUNDAY_WEEK_MS))
    : null;
  // 마지막 등장 뒤 이미 지나간 무등장 주는 right-censored exposure로 포함하되,

  const observedGap = hitRows.length && lastObservedDateMs != null

    : 0;
  if (lastDate && lastDate >= SUNDAY_CONTINUOUS_START) {
    for (let atRisk = 1; atRisk <= observedGap; atRisk++) {
      exposure[sundayGapBucket(atRisk)] += 1;
    }
  }
  const bucket = sundayGapBucket(currentGap == null ? 999 : Math.max(1, currentGap));
  const pGap = hitRows.length >= 4
    ? sundayMix(pRecent, 12, success[bucket], exposure[bucket])
    : pRecent;
  const probability = Math.max(0.001, Math.min(0.95,
    0.15 * pFrequency + 0.50 * pRecent + 0.20 * pCalendar + 0.15 * pGap
  ));
  const effectiveSample = recentWeightSquare > 0
    ? (recentWeight * recentWeight) / recentWeightSquare
    : 0;

  return {
    benefit,
    probability,
    pFrequency,
    pRecent,
    pCalendar,
    pGap,
    count: hitRows.length,
    weeks: weekCount,
    recentCount,
    recentWeeks,
    lastDate,
    currentGap,
    observedGap,
    medianGap: sundayMedian(gapValues),
    confidence,
  };
}

function sundayPickFinalChoice(records, targetDate) {

function sundayPredictRareEvent(records, benefit, forecastStart, horizonWeeks = 104) {
  const sundayRows = (records || [])
    .filter(record => record.kind === 'sunday')
    .sort((a, b) => a.date.localeCompare(b.date));
  const observedThrough = sundayRows.length ? sundayRows[sundayRows.length - 1].date : null;
  if (!observedThrough) return null;

  // 샤이닝·미라클이라는 정확한 기록명만 사용한다. 일반 스타포스/큐브 행사는 합치지 않는다.
  const rawHitDates = [...new Set(
    (records || [])
      .filter(record => record.date <= observedThrough && (record.benefits || []).includes(benefit))
      .map(record => record.date)
  )].sort();
  const hitDates = [...new Set(rawHitDates.map(sundayCurrentOrNextCalendarDate))].sort();
  if (hitDates.length < 3) return null;

  const gaps = [];
  const gapWeights = [];
  for (let index = 1; index < hitDates.length; index++) {
    const gap = sundayWeeksBetween(hitDates[index], hitDates[index - 1]);
    if (!(gap > 0)) continue;
    gaps.push(gap);
    const age = sundayWeeksBetween(observedThrough, hitDates[index]);
    gapWeights.push(Math.pow(2, -age / 78));
  }
  if (!gaps.length) return null;

  const weightTotal = gapWeights.reduce((sum, weight) => sum + weight, 0);
  const weightSquareTotal = gapWeights.reduce((sum, weight) => sum + weight * weight, 0);

    Math.max(Number.EPSILON, weightTotal);

    const date = sundayAddDays(forecastStart, index * 7);
