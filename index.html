  if (!candidates.length) return null;

  const kdeValues = candidates.map(candidate => gaps.reduce((sum, gap, index) => {
    const distance = (candidate.gap - gap) / bandwidth;
    return sum + gapWeights[index] * Math.exp(-0.5 * distance * distance);
  }, 0));
  const geometricP = Math.max(0.001, Math.min(0.95, 1 / Math.max(1, weightedMeanGap)));
  const geometricValues = candidates.map(candidate =>
    geometricP * Math.pow(1 - geometricP, Math.max(0, candidate.gap - 1))

  const geometricProbabilities = sundayNormalizeScores(geometricValues);

  // 완료 간격 모델과 직접 혼합한다. 각 성분은 먼저 합계 1로 정규화한다.
  const seasonWeights = hitDates.map(date =>
    Math.pow(2, -sundayWeeksBetween(observedThrough, date) / 156)
  );
  const seasonWeightTotal = seasonWeights.reduce((sum, weight) => sum + weight, 0);
  const seasonScores = candidates.map(candidate => {
    const targetWeek = sundayWeekOfYear(candidate.date);
    return hitDates.reduce((sum, date, index) => {
      const weekDistance = sundayCircularWeekDistance(targetWeek, sundayWeekOfYear(date));
      return sum + seasonWeights[index] * Math.exp(-0.5 * Math.pow(weekDistance / 4, 2));
    }, 0) / Math.max(Number.EPSILON, seasonWeightTotal);

  const seasonProbabilities = sundayNormalizeScores(seasonScores);
  const previousYearCompleteFlags = candidates.map(candidate => {
    const candidateYear = Number(candidate.date.slice(0, 4));
    return observedThrough >= `${candidateYear - 1}-12-31`;
  });
  const previousYearScores = candidates.map((candidate, index) => {
    const candidateYear = Number(candidate.date.slice(0, 4));
    if (!previousYearCompleteFlags[index]) return seasonScores[index];
    const previousDates = hitDates.filter(date => Number(date.slice(0, 4)) === candidateYear - 1);
    if (!previousDates.length) return seasonScores[index];
    const targetWeek = sundayWeekOfYear(candidate.date);
    return previousDates.reduce((sum, date) => {
      const weekDistance = sundayCircularWeekDistance(targetWeek, sundayWeekOfYear(date));

    SUNDAY_RARE_MODEL_WEIGHTS.season * seasonProbabilities[index] +

  let modeIndex = 0;
  for (let index = 1; index < probabilities.length; index++) {
    if (probabilities[index] > probabilities[modeIndex]) modeIndex = index;
  }

  const targetMass = 0.70;
  let bestRange = { start: 0, end: probabilities.length - 1, mass: 1 };
  for (let start = 0; start <= modeIndex; start++) {
    let mass = 0;
    for (let end = start; end < probabilities.length; end++) {
      mass += probabilities[end];
      if (end < modeIndex || mass < targetMass) continue;
      const width = end - start;
      const bestWidth = bestRange.end - bestRange.start;
      if (width < bestWidth || (width === bestWidth && mass > bestRange.mass)) {

  const peakMonths = monthCounts
    .filter(item => item.count > 0)
    .sort((a, b) => b.count - a.count || a.month - b.month)

    month: index + 1,

  }));
  const recentPeakMonths = recentMonthCounts
    .filter(item => item.count > 0)
    .sort((a, b) => b.count - a.count || a.month - b.month)
    .slice(0, 3);
  const yearlyHistory = [...new Set(rawHitDates.map(date => Number(date.slice(0, 4))))]
    .sort((a, b) => b - a)
    .map(year => ({ year, dates: rawHitDates.filter(date => Number(date.slice(0, 4)) === year) }));
  const recentGapValues = gaps.slice(-8);

    coreRangeStart,

  const topCandidateDates = [...candidateProbabilities]
    .sort((a, b) => b.probability - a.probability || a.date.localeCompare(b.date))
    .slice(0, 3)

    historyCount: hitDates.length,

    predictedGapWeeks: candidates[modeIndex].gap,
    meanGap: gaps.reduce((sum, gap) => sum + gap, 0) / gaps.length,
    medianGap: sundayMedian(gaps),
    gapQ25: sundayWeightedQuantile(gaps, gapWeights, 0.25),
    gapQ75: sundayWeightedQuantile(gaps, gapWeights, 0.75),
    weightedMedianGap: sundayWeightedQuantile(gaps, gapWeights, 0.5),
    weightedMeanGap,
    previousYear,
    previousYearDates,
    previousYearProjectedDates,
    recentDates: rawHitDates.slice(-6).reverse(),
    recentGaps: gaps.slice(-5),
    recentGapMedian: sundayMedian(recentGapValues),
    recentGapMean: recentGapValues.reduce((sum, gap) => sum + gap, 0) /
      Math.max(1, recentGapValues.length),
    monthCounts,
    peakMonths,
    recentMonthCounts,
    recentPeakMonths,
    yearlyHistory,
    currentYear: Number(observedThrough.slice(0, 4)),
    coreRangeStart,
    coreRangeEnd,
    topCandidateDates,
    weeklyProbabilityAtPredictedDate: sundayForecastBenefit(
      records, benefit, candidates[modeIndex].date
    ).probability,
    modelWeights: SUNDAY_RARE_MODEL_WEIGHTS,
    candidateProbabilities,
  };
}

function sundayBacktest(records, cutoffDate) {
  const rows = (records || [])
    .filter(record => record.kind === 'sunday' && record.date <= cutoffDate)
    .sort((a, b) => a.date.localeCompare(b.date));
  const targets = rows.slice(-52);
  let evaluated = 0, top1Hits = 0, baselineTop1Hits = 0;
  let top3Hits = 0, baselineTop3Hits = 0;
  let top3LabelHits = 0, baselineTop3LabelHits = 0, actualLabelCount = 0;
  let brierTotal = 0, baselineBrierTotal = 0, brierCount = 0;
  for (const target of targets) {
    const actual = new Set(target.benefits || []);
    const knownCandidates = new Set();
    for (const record of rows) {
      if (record.date >= target.date) break;
      for (const benefit of record.benefits || []) knownCandidates.add(benefit);
    }
    if (!actual.size || !knownCandidates.size) continue;
    const ranked = sundayRankForecasts([...knownCandidates]
      .map(benefit => sundayForecastBenefit(rows, benefit, target.date)));
    const top3 = ranked.slice(0, 3);
    const baselineTop3 = sundayRankForecasts(ranked, 'pFrequency').slice(0, 3);
    const hitCount = top3.filter(item => actual.has(item.benefit)).length;
    const baselineHitCount = baselineTop3.filter(item => actual.has(item.benefit)).length;
    if (hitCount) top3Hits += 1;
    if (baselineHitCount) baselineTop3Hits += 1;
    if (top3[0] && actual.has(top3[0].benefit)) top1Hits += 1;
    if (baselineTop3[0] && actual.has(baselineTop3[0].benefit)) baselineTop1Hits += 1;
    top3LabelHits += hitCount;
    baselineTop3LabelHits += baselineHitCount;
    actualLabelCount += actual.size;
    for (const item of ranked) {
      const outcome = actual.has(item.benefit) ? 1 : 0;
      brierTotal += Math.pow(item.probability - outcome, 2);
      baselineBrierTotal += Math.pow(item.pFrequency - outcome, 2);
      brierCount += 1;
    }
    for (const unseenActual of actual) {
      if (knownCandidates.has(unseenActual)) continue;
      brierTotal += 1;
      baselineBrierTotal += 1;
      brierCount += 1;
    }
    evaluated += 1;
  }
  return {
    weeks: evaluated,
    top1Rate: evaluated ? top1Hits / evaluated : 0,
    baselineTop1Rate: evaluated ? baselineTop1Hits / evaluated : 0,
    top3Rate: evaluated ? top3Hits / evaluated : 0,
    baselineTop3Rate: evaluated ? baselineTop3Hits / evaluated : 0,
    precisionAt3: evaluated ? top3LabelHits / (evaluated * 3) : 0,
    recallAt3: actualLabelCount ? top3LabelHits / actualLabelCount : 0,
    baselineRecallAt3: actualLabelCount ? baselineTop3LabelHits / actualLabelCount : 0,
    averageBenefits: evaluated ? actualLabelCount / evaluated : 0,
    brier: brierCount ? brierTotal / brierCount : 0,
    baselineBrier: brierCount ? baselineBrierTotal / brierCount : 0,
  };
}

  const [year, month, day] = dateText.split('-');
  return `${year}.${month}.${day}`;

const sundayFormatMonthDay = (dateText) => {
  const [, month, day] = dateText.split('-').map(Number);
  return `${month}/${day}`;
};

      <input type="number" min="0" max={max} step="1" inputMode="numeric"
        value={value ?? ''} placeholder={placeholder}

function ExplorationCoinCalc({ characters, value, onChange }) {

  const [addingKey, setAddingKey] = useState(MILEAGE_BOSS_OPTIONS[0].key);
  const set = (key, next) => onChange({ ...value, [key]: next });
  const setBoss = (key, field, next) => set('bosses', value.bosses.map(row =>
    row.key === key ? { ...row, [field]: field === 'amount' && next === '' ? null : next } : row));
  const addBoss = () => {
    if (value.bosses.some(row => row.key === addingKey)) return;
    set('bosses', [...value.bosses, { key: addingKey, amount: null, count: 1, received: 0 }]);
  };
  const loadCharacters = () => {
    const rows = mileageBossPlanFromCharacters(characters, value.bosses);
    if (value.bosses.length && !confirm('등록 캐릭터의 보스 선택으로 횟수 목록을 다시 만들까요? 같은 보스의 입력 지급량과 수령 횟수는 유지됩니다.')) return;
    set('bosses', rows);
  };
  const fmt = number => number.toLocaleString('ko-KR');
  return (
    <div className="space-y-5">
      <div className="grid sm:grid-cols-3 gap-3" aria-live="polite">
        <div className="rounded-xl border border-amber-500/40 bg-amber-500/10 p-4">
          <div className="text-sm text-amber-200">{result.unknownCount ? '입력 완료분 예상 획득' : '앞으로 예상 획득'}</div>
          <div className="text-2xl font-bold text-maple-accent mt-2">{fmt(result.total)} <span className="text-sm font-normal">개</span></div>
          <div className="text-xs text-slate-400 mt-1">한도 적용 {fmt(result.capped)} + 한도 제외 {fmt(result.exempt)}</div>
        </div>
        <div className="rounded-xl border border-maple-border bg-maple-panel p-4">
          <div className="text-sm text-slate-300">현재 월간 한도 잔여</div>
          <div className="text-2xl font-bold mt-2">{fmt(result.remaining)} <span className="text-sm font-normal">개</span></div>
          <div className="text-xs text-slate-400 mt-1">계획 반영 후 잔여 {fmt(100000 - result.monthEarned)}개</div>
        </div>
        <div className="rounded-xl border border-maple-border bg-maple-panel p-4">
          <div className="text-sm text-slate-300">계획 후 예상 보유량</div>
          <div className="text-2xl font-bold text-emerald-300 mt-2">{fmt(result.balance)} <span className="text-sm font-normal">개</span></div>
          <div className="text-xs text-slate-400 mt-1">현재 보유량 + 예상 획득량 · 사용/소멸 전</div>
        </div>
      </div>
      {result.unknownCount > 0 && <p role="status" className="text-sm text-amber-200 bg-amber-500/10 rounded-lg px-4 py-3">
        지급량을 입력하지 않은 보스 {result.unknownCount}종은 합계에서 빠져 있습니다. 보스별 지급량은 공식 공지에 없어 게임에서 확인한 1인 수령량을 입력해 주세요.
      </p>}
      {result.overflow > 0 && <p className="text-sm text-rose-200 bg-rose-500/10 rounded-lg px-4 py-3">

      <section className="bg-maple-panel border border-maple-border rounded-xl p-4 md:p-5 space-y-4">

              <MileageNumber label={`${row.name} ${row.difficulty} ${row.monthly ? '이번 달' : '첫 회차'} 이미 받은 횟수`} value={row.received} max={6} onChange={next => setBoss(row.key, 'received', next)} />

          <MileageNumber label="메이플스토리M 하루 수령 코인" value={value.mapleM} max={700} onChange={next => set('mapleM', next)} hint={`하루 최대 700개 → 계획 합계 ${fmt(result.mapleMCoins)}개`} />
          <MileageNumber label="몬스터 컬렉션 예정 코인 합계" value={value.collection} onChange={next => set('collection', next)} hint="위 활동 기간의 총 수령 예상량" />
          <MileageNumber label="데일리 기프트 예정 코인 합계" value={value.gift} onChange={next => set('gift', next)} hint="월간 10만 개 한도에서 제외" />
          <MileageNumber label="PC방 보상 예정 코인 합계" value={value.pc} onChange={next => set('pc', next)} hint="월간 10만 개 한도에서 제외" />
        </div>
        <p className="text-sm text-slate-400 leading-relaxed">기프트 교환권은 같은 넥슨ID의 다른 메이플ID에서 당월 중복 사용할 수 없습니다. PC방 일일 보상 교환권은 당일 중복 사용할 수 없습니다. 코인의 공통 일일 한도는 없으며 획득 즉시 적립됩니다.</p>
      </section>
    </div>
  );
}

const CREDIT_SHOP_TARGETS = [
  ['프라임 큐브', 10000], ['프라임 에디셔널 큐브', 20000], ['심연의 서큘레이터', 4900],
  ['솔 에르다', 9900], ['플래티넘 카르마의 가위', 5900], ['위습의 원더베리', 5400],
  ['루나 크리스탈', 3900], ['메이플 로얄 스타일', 2200], ['프리미엄 마스터피스', 1900],
  ['컬러링 프리즘 프로', 25000], ['무기 이펙트 프리즘', 15000],
  ['프리미엄 헤어 쿠폰', 5500], ['프리미엄 성형 쿠폰', 3500],
  ['커스텀 믹스염색 쿠폰', 48000], ['커스텀 믹스 컬러렌즈 쿠폰', 24000],
  ['밸런스 믹스 염색 쿠폰', 24000], ['밸런스 믹스 컬러렌즈 쿠폰', 12000],
];
function MapleCreditCalc({ value, onChange }) {
  const result = useMemo(() => calculateMapleCredit(value), [value]);
  const set = (key, next) => onChange({ ...value, [key]: next });
  const fmt = number => number.toLocaleString('ko-KR', { maximumFractionDigits: 2 });
  return (
    <div className="space-y-5">
      <div className="grid sm:grid-cols-3 gap-3" aria-live="polite">
        {[
          ['구매 시 적립 예상', result.expected, 'text-maple-accent'],
          ['구매 확정 반영 잔액', result.available, 'text-emerald-300'],
          ['목표까지 부족한 크레딧', result.shortage, 'text-sky-300'],
        ].map(([label, amount, tone]) => <div key={label} className="rounded-xl border border-maple-border bg-maple-panel p-4">
          <div className="text-sm text-slate-300">{label}</div>
          <div className={`text-2xl font-bold mt-2 ${tone}`}>{fmt(amount)} <span className="text-sm font-normal">크레딧</span></div>
        </div>)}
      </div>
      <section className="bg-maple-panel border border-maple-border rounded-xl p-4 md:p-5 space-y-4">
        <h3 className="text-lg font-semibold">넥슨캐시 구매액의 5% 적립</h3>
        <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <MileageNumber label="상품 1개 가격 (캐시)" value={value.price} onChange={next => onChange({ ...value, price: next, cashPaid: next })} />
          <MileageNumber label="상품 1개당 실제 넥슨캐시 결제액" value={value.cashPaid} max={mileageInt(value.price)} onChange={next => set('cashPaid', next)} hint="포인트·기존 마일리지 등 다른 결제분은 제외" />
          <MileageNumber label="구매 수량" value={value.quantity} max={1000} onChange={next => set('quantity', next)} />
          <MileageNumber label="현재 메이플크레딧 잔액" value={value.balance} onChange={next => set('balance', next)} />
        </div>
        <div className="flex flex-wrap gap-5 text-sm">
          <label className="flex items-center gap-2 cursor-pointer"><input type="checkbox" checked={value.gift} onChange={event => set('gift', event.target.checked)} className="w-4 h-4 accent-amber-400" />선물 구매</label>
          <label className="flex items-center gap-2 cursor-pointer"><input type="checkbox" checked={value.confirmed} onChange={event => set('confirmed', event.target.checked)} className="w-4 h-4 accent-amber-400" />구매 확정 반영</label>
        </div>
        <p className="text-sm text-slate-300 leading-relaxed">넥슨캐시 결제 합계 {fmt(result.cashTotal)}캐시 · {value.gift ? '선물은 발신·수신 모두 적립 제외' : mileageInt(value.price) < 10 ? '10캐시 미만 상품은 적립 제외' : `5% 적립 ${fmt(result.expected)}크레딧`}</p>
        {!value.confirmed && <p className="text-sm text-amber-200">구매 확정 전 예정 적립 {fmt(result.pending)}크레딧은 잔액에 포함하지 않았습니다.</p>}
        <p className="text-xs text-slate-400 leading-relaxed">적립액은 5%를 그대로 계산한 예상값입니다. 공지에 소수점 처리 방식이 없어 임의로 절사하지 않습니다. 청약철회 가능한 상품은 구매 확정 시 적립됩니다.</p>
      </section>
      <section className="bg-maple-panel border border-maple-border rounded-xl p-4 md:p-5 space-y-4">
        <h3 className="text-lg font-semibold">목표 상품까지 계산</h3>
        <label className="block text-sm text-slate-300">크레딧샵 상품 가격 불러오기
          <select aria-label="크레딧샵 목표 상품" defaultValue="" onChange={event => { if (event.target.value !== '') set('target', Number(event.target.value)); }}
            className="block w-full mt-1.5 bg-maple-bg border border-maple-border rounded-lg px-3 py-2.5">
            <option value="">상품 선택</option>
            {CREDIT_SHOP_TARGETS.map(([name, price]) => <option key={name} value={price}>{name} · {fmt(price)}크레딧</option>)}
          </select>
        </label>
        <MileageNumber label="목표 가격 또는 장바구니 총액 (크레딧)" value={value.target} onChange={next => set('target', next)} />
        <div className="rounded-lg bg-maple-bg border border-maple-border p-4">
          <div className="text-sm text-slate-300">부족분을 적립하는 데 필요한 추가 넥슨캐시 구매액</div>
          <div className="text-xl font-bold text-sky-300 mt-2">{fmt(result.extraCash)}캐시</div>
          <p className="text-xs text-slate-400 mt-1">전액 넥슨캐시로 적립 대상 상품을 구매하고 확정하는 경우의 계산입니다. 충전만으로 적립되지 않습니다.</p>
        </div>
        <p className="text-sm text-slate-400 leading-relaxed">크레딧은 넥슨ID 단위로 공유하며 적립일로부터 1년간 유효합니다. 프라임 큐브·프라임 에디셔널 큐브 판매는 2026년 11월 18일 23:59까지로 공지되었습니다.</p>
      </section>
    </div>
  );
}

function MileageView({ characters, value, onChange }) {
  const [tab, setTab] = useState('coins');
  return (
    <div className="max-w-5xl mx-auto space-y-5">
      <div>
        <h2 className="text-2xl md:text-3xl font-bold">🪙 새 마일리지 계산</h2>
        <p className="text-slate-400 mt-2">게임 플레이는 탐험 코인, 넥슨캐시 구매는 메이플크레딧으로 계산합니다.</p>
      </div>
      <div className="flex gap-2 flex-wrap" role="group" aria-label="마일리지 계산 종류">
        {[['coins', '탐험 코인'], ['credit', '메이플크레딧']].map(([id, label]) => <button key={id} type="button" aria-pressed={tab === id} onClick={() => setTab(id)}
          className={`px-5 py-3 rounded-lg border text-sm font-semibold ${tab === id ? 'bg-maple-accent text-slate-900 border-maple-accent' : 'bg-maple-panel text-slate-300 border-maple-border hover:border-maple-accent'}`}>{label}</button>)}
      </div>
      {tab === 'coins'
        ? <ExplorationCoinCalc characters={characters} value={value.coins} onChange={coins => onChange({ ...value, coins })} />
        : <MapleCreditCalc value={value.credit} onChange={credit => onChange({ ...value, credit })} />}
      <p className="text-sm text-slate-400 leading-relaxed border-t border-maple-border pt-4">
        기존 마일리지를 새 코인·크레딧으로 환산하지 않습니다. 미수령·미정산 마일리지는 9/17 점검 후,
        정산된 기존 잔액은 11/19 점검 후 소멸 예정입니다. 입력값은 이 브라우저에 저장되며 내보내기 백업에 포함됩니다.
      </p>
    </div>
  );
}

/* =========================================================
 * 마운트
 * ========================================================= */
class AppErrorBoundary extends React.Component {
  constructor(props) {
    super(props);
    this.state = { error: null };
  }
  static getDerivedStateFromError(error) {
    return { error };
  }
  componentDidCatch(error, info) {
    console.error('Maple Check render error', error, info);
  }
  render() {
    if (this.state.error) {
      return (
        <main className="min-h-full bg-maple-bg p-6 text-slate-200">
          <div className="max-w-2xl mx-auto rounded-xl border border-red-500/40 bg-red-500/10 p-5">
            <h1 className="text-lg font-bold text-red-200">화면을 표시하지 못했습니다.</h1>
            <p className="mt-2 text-sm text-slate-400">새로고침 후에도 계속되면 아래 오류를 함께 알려 주세요.</p>
            <pre className="mt-3 overflow-auto whitespace-pre-wrap text-xs text-red-200">{String(this.state.error?.stack || this.state.error)}</pre>
          </div>
        </main>
      );
    }
    return this.props.children;
  }
}
const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<AppErrorBoundary><App /></AppErrorBoundary>);
